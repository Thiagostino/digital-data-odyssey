  }
}

/* =====================================================================
   12a-1. CANOS ESTILO MARIO: entrada (desce) e saida (sobe)
   ===================================================================== */
function pipeStart(modo, cano, depois) {
  var alvo = Math.max(12, cano.h - 4);      // termina escondida dentro do cano
  PIPE = { modo: modo, cano: cano, t: 0, dur: 52, depois: depois };
  P.x = Math.round(cano.x + cano.w / 2 - P.w / 2);
  P.vx = 0; P.vy = 0; P.face = 1; P.riding = null; P.ground = null; P.onGround = false; P.inv = 0;
  PIPE.y0 = modo === 'in' ? cano.y - P.h : cano.y - P.h + alvo;
  PIPE.y1 = modo === 'in' ? cano.y - P.h + alvo : cano.y - P.h;
  P.y = PIPE.y0;
  cam.x = Math.max(0, Math.min(P.x - VIEWW * 0.42, LEVEL_W - VIEWW));
  state = 'pipe';
  SFX.pipe(modo === 'out');
  for (var i = 0; i < 10; i++) {
    parts.push({
      x: cano.x + 4 + Math.random() * (cano.w - 8), y: cano.y + 2,
      vx: (Math.random() - 0.5) * 2.2, vy: -0.6 - Math.random() * 1.4,
      life: 30 + Math.random() * 18, t: 0, c: '#9fe8a8', g: 0.05
    });
  }
}
function pipeUpdate() {
  var Q = PIPE;
  Q.t++;
  var k = Math.min(1, Q.t / Q.dur);
  k = k * k * (3 - 2 * k);                       // suaviza entrada e saida
  P.y = Q.y0 + (Q.y1 - Q.y0) * k;
  P.anim += 0.9;                                 // continua com as perninhas mexendo
  if (Q.t === Math.round(Q.dur * 0.55)) {
    for (var i = 0; i < 6; i++) {
      parts.push({
        x: Q.cano.x + 6 + Math.random() * (Q.cano.w - 12), y: Q.cano.y + 1,
        vx: (Math.random() - 0.5) * 1.8, vy: -0.4 - Math.random(),
        life: 26, t: 0, c: '#c8ffd2', g: 0.04
      });
    }
  }
  updateCam();
  if (Q.t >= Q.dur + 14) {
    var depois = Q.depois;
    PIPE = null;
    if (depois === 'tunnel') { tunnelStart(); return; }
    P.onGround = true; P.vy = 0; P.inv = 40;
    P.spawnX = P.x; P.spawnY = P.y;
    state = 'play'; MUS.on = true;
    toast('SAIDA DO PIPELINE · PANTEAO DA INTELIGENCIA', '#4fdcff');
  }
}

/* =====================================================================
   12a-2. ARENA DO MINIBOSS DE FINOPS
   Mesma mecanica nas duas rotas: a secao abre com animacao, a engenheira
   tem 3 vidas, a cifra gigante patrulha e dispara faturas (rasas = pule,
   altas = passe correndo) e cai com 3 pisoes. Ao morrer, explode em moedas.
   ===================================================================== */
var ARENA = null;
var ARENA_SPD = 2.5;

function arenaFY() { return playFloorY(); }
function arenaStart(origem) {
  var FY = arenaFY();
  // a cifra se ajusta a largura da tela: em retrato a arena e estreita
  var bw = Math.max(30, Math.min(46, Math.round(VIEWW * 0.13)));
  ARENA = {
    origem: origem, t: 0, fase: 'intro', faseT: 0,
    x: Math.round(VIEWW * 0.14), y: FY - P.h, vx: 0, vy: 0,
    onG: true, face: 1, anim: 0, lives: 3, inv: 60, hurt: 0,
    x0: 10, x1: VIEWW - 10, shake: 0, coins: [], bills: [], pops: [], economia: 0,
    boss: {
      x: Math.round(VIEWW * 0.66), y: -70, w: bw, h: bw, hp: 3, max: 3,
      vx: 0.75, inv: 0, fire: 150, alt: 0, dead: 0, dieT: 0, t: 0, entrou: 0
    }
  };
  game.arenaFrom = origem;
  track('finops_boss_start', { rota: origem, vidas: 3 });
  state = 'arena';
  MUS.on = true;
  SFX.route();
}
function arenaFinish() {
  var origem = ARENA.origem, economia = ARENA.economia;
  ARENA = null;
  if (fboss) fboss.done = true;
  finopsGate(true);
  game.zone = 3;
  cam.y = GY + 70 - VIEWH;
  track('finops_savings', {
    valor_brl: economia, moedas: Math.round(economia / 100000),
    moeda_valor_brl: 100000, rota: origem
  });
  toast('FINOPS · CUSTO OTIMIZADO EM ' + moeda(economia), '#7ef29d');
  if (exitPipe) {
    P.spawnX = exitPipe.x + 46; P.spawnY = GY - 40;
    pipeStart('out', exitPipe, 'play');          // brota do cano, estilo Mario
    return;
  }
  P.x = 8600; P.y = GY - 40; P.spawnX = 8600; P.spawnY = GY - 40;
  P.vx = 0; P.vy = 0; P.inv = 50; P.riding = null;
  cam.x = Math.max(0, P.x - VIEWW * 0.42);
  state = 'play'; MUS.on = true;
}
function arenaDeath() {
  if (state !== 'arena') return;
  SFX.error();
  game.deaths++;
  game.deadIn = 'arena';
  track('player_death', { onde: 'arena_finops', rota: ARENA.origem, boss_hp: ARENA.boss.hp, mortes: game.deaths });
  burst(ARENA.x + 6, ARENA.y + 8, 26, '#ff4d6d', 3);
  MUS.on = false;
  state = 'dead';
}
function arenaHurt() {
  var A = ARENA;
  if (A.inv > 0 || A.fase !== 'luta') return;
  A.lives--; A.inv = 100; A.hurt = 26; A.shake = 14; SFX.error();
  A.vy = -3.4; A.vx = A.face > 0 ? -2.4 : 2.4;
  burst(A.x + 6, A.y + 8, 14, '#ff4d6d', 2.4);
  if (A.lives <= 0) arenaDeath();
  else toast('VIDA PERDIDA · RESTAM ' + A.lives, '#ff9db0');
}
function arenaBossHit() {
  var A = ARENA, B = A.boss, i;
  if (B.inv > 0 || B.dead) return;
  B.hp--; B.inv = 50; A.vy = -5.4; A.vx = (A.x + P.w / 2 < B.x + B.w / 2) ? -2.6 : 2.6;
  A.inv = Math.max(A.inv, 34); A.shake = 10; SFX.stomp();
  A.bills.length = 0;
  game.score += 500 * game.mult;
  burst(B.x + B.w / 2, B.y + 6, 18, '#ffb020', 2.6);
  if (B.hp <= 0) {
    B.dead = 1; B.dieT = 0; A.fase = 'explode'; A.faseT = 0; A.shake = 26;
    SFX.ok();
    track('finops_boss_defeated', { rota: A.origem, vidas_restantes: A.lives, segundos: Math.round(A.t / 60) });
    // explode em moedas
    for (i = 0; i < 34; i++) {
      var ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.5, v = 2 + Math.random() * 3.4;
      A.coins.push({
        x: B.x + B.w / 2 - 4, y: B.y + B.h / 2 - 4,
        vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 1.2,
        t: 0, got: 0, spin: Math.random() * 6
      });
    }
    toast('FINOPS OK · CADA MOEDA VALE R$ 100 MIL', '#7ef29d');
  } else {
    B.vx = B.vx > 0 ? B.vx + 0.2 : B.vx - 0.2;
    toast('CUSTO CORTADO: ' + arenaCamadas()[B.max - B.hp - 1], '#ffe14d');
  }
}
function arenaCamadas() { return ARENA.origem === 'realtime' ? FINOPS_STREAM : FINOPS_BATCH; }

function arenaUpdate() {
  var A = ARENA, B = A.boss, FY = arenaFY(), i;
  A.t++;
  if (A.shake > 0) A.shake--;
  if (A.inv > 0) A.inv--;
  if (A.hurt > 0) A.hurt--;
  readInput();

  // ---- animacao de abertura: a cifra desce para a arena
  if (A.fase === 'intro') {
    A.faseT++;
    B.y += ((FY - B.h) - B.y) * 0.055;
    B.t++;
    if (A.faseT > 108) { A.fase = 'luta'; A.faseT = 0; B.y = FY - B.h; B.fire = 90; SFX.turbo(); }
  }

  // ---- fisica da engenheira (igual a do mundo)
  var ms = ARENA_SPD;
  if (IN.left) { A.vx -= ACC; A.face = -1; }
  if (IN.right) { A.vx += ACC; A.face = 1; }
  if (!IN.left && !IN.right) A.vx *= FRIC;
  if (A.vx > ms) A.vx = ms;
  if (A.vx < -ms) A.vx = -ms;
  if (Math.abs(A.vx) < 0.04) A.vx = 0;
  if (jumpEdge && A.onG) { A.vy = JUMPV; A.onG = false; SFX.jump(); }
  if (!IN.jump && A.vy < -2.6) A.vy = -2.6;
  A.vy += GRAV;
  if (A.vy > MAXFALL) A.vy = MAXFALL;
  A.x += A.vx; A.y += A.vy;
  if (A.x < A.x0) { A.x = A.x0; A.vx = 0; }
  if (A.x + P.w > A.x1) { A.x = A.x1 - P.w; A.vx = 0; }
  if (A.y + P.h >= FY) { A.y = FY - P.h; A.vy = 0; A.onG = true; } else A.onG = false;
  A.anim += Math.abs(A.vx);

  // ---- moedas da explosao
  for (i = A.coins.length - 1; i >= 0; i--) {
    var c = A.coins[i];
    c.t++; c.spin += 0.3;
    c.x += c.vx; c.y += c.vy; c.vy += 0.22; c.vx *= 0.995;
    if (c.y + 8 > FY) { c.y = FY - 8; c.vy *= -0.42; c.vx *= 0.82; if (Math.abs(c.vy) < 0.5) c.vy = 0; }
    if (!c.got && A.x + P.w > c.x - 2 && A.x < c.x + 10 && A.y + P.h > c.y - 2 && A.y < c.y + 10) {
      // cada moeda = R$ 100 mil de custo otimizado, e isso entra na pontuacao final
      c.got = 1; SFX.collect();
      A.economia += 100000;
      game.finopsSave += 100000;
      game.score += 1000 * game.mult;
      A.pops.push({ x: c.x, y: c.y, t: 0 });
      burst(c.x + 4, c.y + 4, 6, '#ffc93c', 1.6);
      A.coins.splice(i, 1);
    }
  }

  for (i = A.pops.length - 1; i >= 0; i--) {
    A.pops[i].t++;
    if (A.pops[i].t > 46) A.pops.splice(i, 1);
  }
  if (A.fase === 'explode') {
    A.faseT++;
    B.dieT++;
    if (B.dieT % 6 === 0 && B.dieT < 40) burst(B.x + B.w / 2, B.y + 20, 10, B.dieT % 2 ? '#ffc93c' : '#7ef29d', 2.6);
    if (A.faseT > 480) { arenaFinish(); return; }
    if (A.faseT > 130 && A.coins.length === 0) { arenaFinish(); return; }
    return;
  }
  if (A.fase !== 'luta') return;

  // ---- a cifra patrulha e fatura
  B.t++;
  if (B.inv > 0) B.inv--;
  B.x += B.vx;
  if (B.x < A.x0 + 12) { B.x = A.x0 + 12; B.vx = Math.abs(B.vx); }
  if (B.x + B.w > A.x1 - 12) { B.x = A.x1 - 12 - B.w; B.vx = -Math.abs(B.vx); }
  B.fire--;
  if (B.fire <= 0) {
    B.fire = 116 + B.hp * 14;
    B.alt = (B.alt + 1) % 2;
    var dir = (A.x + P.w / 2 < B.x + B.w / 2) ? -1 : 1;
    A.bills.push({
      x: B.x + (dir < 0 ? -16 : B.w), y: B.alt ? FY - 40 : FY - 13,
      w: 16, h: 13, vx: dir * 1.5, t: 0, label: B.alt ? 'OVERPROVISION' : 'FATURA'
    });
    SFX.nope();
  }
  for (i = A.bills.length - 1; i >= 0; i--) {
    var bl = A.bills[i];
    bl.x += bl.vx; bl.t++;
    if (bl.x < A.x0 - 40 || bl.x > A.x1 + 40 || bl.t > 400) { A.bills.splice(i, 1); continue; }
    if (A.inv <= 0 && A.x + P.w > bl.x + 2 && A.x < bl.x + bl.w - 2 &&
        A.y + P.h > bl.y + 2 && A.y < bl.y + bl.h - 2) { A.bills.splice(i, 1); arenaHurt(); return; }
  }
  // ---- pisao: subir por baixo nao machuca, so o corpo a corpo
  if (A.x + P.w > B.x + 3 && A.x < B.x + B.w - 3 && A.y + P.h > B.y + 2 && A.y < B.y + B.h - 4) {
    var pes = A.y + P.h;
    if (A.vy > 0.5 && pes - B.y < 22) arenaBossHit();
    else if (B.inv <= 0 && pes > B.y + 20) { arenaHurt(); return; }
  }
}

function arenaDraw() {
  var A = ARENA, B = A.boss, FY = arenaFY(), i;
  var real = A.origem === 'realtime';
  var sh = A.shake > 0 ? ((A.t % 2) ? 2 : -2) : 0;
  ctx.save();
  ctx.translate(sh, 0);

  // ---- cenario da arena (túnel ou fábrica, conforme a rota)
  var g = ctx.createLinearGradient(0, 0, 0, FY);
  if (real) { g.addColorStop(0, '#0d1c2b'); g.addColorStop(0.55, '#14364c'); g.addColorStop(1, '#0a1622'); }
  else { g.addColorStop(0, '#101b2a'); g.addColorStop(0.55, '#1b3149'); g.addColorStop(1, '#0b1522'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEWW, FY);
  for (i = 0; i < Math.ceil(VIEWW / 76) + 1; i++) {
    r(i * 76 + 8, 26, 10, FY - 26, 'rgba(70,125,170,0.12)');
    r(i * 76 + 8, 26, 10, 4, '#2b5b7c');
  }
  // grades laterais que fecham a secao
  for (i = 0; i < 2; i++) {
    var gx = i ? VIEWW - 10 : 0;
    box3(gx, 26, 10, FY - 26, '#33465e', '#5f7796', '#1a2433');
    for (var gy = 30; gy < FY - 6; gy += 9) r(gx + 2, gy, 6, 4, '#22303f');
  }
  // painel de custo no fundo
  var pw = Math.min(VIEWW - 90, 190), pxr = VIEWW / 2 - pw / 2;
  box3(pxr, 42, pw, 30, '#122438', '#2f5478', '#060f1c');
  r(pxr + 4, 46, pw - 8, 22, '#08131f');
  txt(B.dead ? 'OTIMIZACAO DE CUSTO' : (real ? 'CUSTO DO STREAMING' : 'CUSTO DA CLOUD'),
      VIEWW / 2, 48, 7, B.dead ? '#9fe8b4' : '#8fb0cc', 'center');
  if (B.dead) {
    // custo sendo otimizado a cada moeda: R$ 100 mil por moeda
    var total = A.coins.length + Math.round(A.economia / 100000);
    var kk = total ? (A.economia / 100000) / total : 1;
    txt(moeda(A.economia), VIEWW / 2, 57, 11, '#7ef29d', 'center');
    r(pxr + 8, 70, pw - 16, 3, '#16283c');
    r(pxr + 8, 70, (pw - 16) * kk, 3, '#7ef29d');
  } else {
    var pct2 = Math.round(B.hp / B.max * 100);
    txt('R$ ' + ['9.9k', '4.4k', '1.2k'][Math.max(0, Math.min(2, B.max - B.hp))],
        VIEWW / 2, 58, 9, B.hp > 1 ? '#ff5f8f' : '#ffe14d', 'center');
    r(pxr + 8, 68, pw - 16, 2, '#16283c');
    r(pxr + 8, 68, (pw - 16) * (pct2 / 100), 2, '#ff5f8f');
  }

  // chao
  r(0, FY, VIEWW, 6, real ? '#3d6b8c' : '#4a5c78');
  r(0, FY + 6, VIEWW, VIEWH, '#0a121c');
  for (i = 0; i < VIEWW; i += 16) r(i, FY + 8, 8, 2, 'rgba(120,190,240,0.18)');

  // ---- moedas
  for (i = 0; i < A.coins.length; i++) {
    var c = A.coins[i], sq = Math.abs(Math.cos(c.spin));
    var cwd = Math.max(2, Math.round(8 * sq));
    r(c.x + (8 - cwd) / 2, c.y, cwd, 8, '#d99a12');
    r(c.x + (8 - cwd) / 2, c.y + 1, cwd, 5, '#ffc93c');
    if (cwd > 4) r(c.x + 4 - 1, c.y + 2, 2, 4, '#8a5f08');
  }
  // ---- avisos de economia subindo
  for (i = 0; i < A.pops.length; i++) {
    var po = A.pops[i];
    ctx.globalAlpha = Math.max(0, 1 - po.t / 46);
    txt('+R$ 100 MIL', po.x + 4, po.y - po.t * 0.5, 7, '#7ef29d', 'center');
    ctx.globalAlpha = 1;
  }
  // ---- faturas
  for (i = 0; i < A.bills.length; i++) drawBill(A.bills[i].x, A.bills[i].y, A.bills[i].label);

  // ---- a cifra
  if (!B.dead) {
    var al = 1;
    if (B.inv > 0 && Math.floor(B.inv / 4) % 2 === 0) al = 0.45;
    drawCifra(B.x, B.y, B.w, B.h, al, B.hp, B.max, B.t, arenaCamadas()[Math.max(0, B.max - B.hp)]);
  } else if (B.dieT < 26) {
    ctx.globalAlpha = Math.max(0, 1 - B.dieT / 26);
    drawCifra(B.x, B.y, B.w, B.h, 1, 0, B.max, B.t, '');
    ctx.globalAlpha = 1;
  }

  // ---- engenheira
  if (!(A.inv > 0 && Math.floor(A.inv / 4) % 2 === 0)) {
    var sv = [P.x, P.y, P.vx, P.onGround, P.face, P.anim, P.inv];
    P.x = A.x; P.y = A.y; P.vx = A.vx; P.onGround = A.onG; P.face = A.face; P.anim = A.anim; P.inv = 0;
    drawPlayer();
    P.x = sv[0]; P.y = sv[1]; P.vx = sv[2]; P.onGround = sv[3]; P.face = sv[4]; P.anim = sv[5]; P.inv = sv[6];
  }
  drawParts();
  ctx.restore();

  // ---- HUD da arena
  r(0, 0, VIEWW, 30, 'rgba(8,16,28,0.86)');
  r(0, 30, VIEWW, 1, 'rgba(255,95,143,0.55)');
  txt(B.dead ? 'OTIMIZACAO DE CUSTO' : 'MINIBOSS FINOPS', 6, 4, VIEWW < 380 ? 9 : 11, B.dead ? '#7ef29d' : '#ff5f8f');
  if (B.dead) txt(moeda(A.economia) + ' · +' + (VIEWW < 380 ? '100 MIL/MOEDA' : 'R$ 100 MIL POR MOEDA'),
                  6, 18, VIEWW < 380 ? 6 : 7, '#c8ffdc');
  else txt('PULE NA CIFRA · 3 PISOES', 6, 18, VIEWW < 380 ? 6 : 7, '#ffd0d8');
  txt('VIDAS', VIEWW - 46, 4, VIEWW < 380 ? 6 : 7, '#a8bdd6', 'right');
  for (i = 0; i < 3; i++) {
    var on = i < A.lives;
    r(VIEWW - 40 + i * 13, 4, 10, 9, on ? '#ff5f8f' : '#2a3442');
    r(VIEWW - 40 + i * 13 + 2, 6, 3, 3, on ? '#ffd0d8' : '#2a3442');
  }
  for (i = 0; i < B.max; i++) r(VIEWW - 40 + i * 13, 18, 10, 5, i < B.hp ? '#ffc93c' : '#2a3442');

  // ---- animacao de abertura e de vitoria
  if (A.fase === 'intro') {
    var k = Math.min(1, A.faseT / 26), fade = A.faseT > 84 ? Math.max(0, 1 - (A.faseT - 84) / 24) : 1;
    ctx.globalAlpha = fade;
    var bw2 = Math.round(Math.min(VIEWW - 24, 240) * k);
    r(VIEWW / 2 - bw2 / 2, VIEWH / 2 - 26, bw2, 44, 'rgba(8,16,28,0.92)');
    r(VIEWW / 2 - bw2 / 2, VIEWH / 2 - 26, bw2, 2, '#ff5f8f');
    r(VIEWW / 2 - bw2 / 2, VIEWH / 2 + 16, bw2, 2, '#ff5f8f');
    if (k > 0.9) {
      txt('MINIBOSS FINOPS', VIEWW / 2, VIEWH / 2 - 20, 13, '#ff5f8f', 'center');
      txt(real ? 'A CIFRA DO STREAMING' : 'A CIFRA DA CLOUD', VIEWW / 2, VIEWH / 2 - 4, 8, '#ffd0d8', 'center');
      txt('3 VIDAS · 3 PISOES', VIEWW / 2, VIEWH / 2 + 6, 7, '#ffe14d', 'center');
    }
    ctx.globalAlpha = 1;
  }
  if (B.dead && A.faseT > 20) {
    var w3 = tw('CUSTO OTIMIZADO!', 14) + 24;
    r(VIEWW / 2 - w3 / 2, 84, w3, 30, 'rgba(8,20,16,0.9)');
    r(VIEWW / 2 - w3 / 2, 84, w3, 2, '#7ef29d');
    txt('CUSTO OTIMIZADO!', VIEWW / 2, 92, 14, '#7ef29d', 'center');
    if (A.coins.length) {
      plaqueta(VIEWW < 320 ? 'CADA MOEDA = R$ 100 MIL' : 'PEGUE AS MOEDAS · CADA UMA VALE R$ 100 MIL',
               VIEWW / 2, 118, VIEWW < 320 ? 7 : 8, '#ffe999', '#ffc93c');
      var tw5 = Math.min(200, VIEWW - 60), tx5 = VIEWW / 2 - tw5 / 2;
      r(tx5 - 1, 134, tw5 + 2, 6, '#0a1421');
      r(tx5, 135, tw5, 4, '#1b2c44');
      r(tx5, 135, tw5 * Math.max(0, 1 - A.faseT / 480), 4, '#ffc93c');
    }
  }
  if (A.t > 2600 && !B.dead) {
    var sw3 = 70, sx3 = VIEWW / 2 - sw3 / 2;
    r(sx3, 122, sw3, 13, 'rgba(10,20,34,0.9)');
    r(sx3, 122, sw3, 1, '#ffb020');
    txt('PULAR LUTA', VIEWW / 2, 124, 7, '#ffb020', 'center', false);
    regBtn('arena-skip', sx3, 122, sw3, 13);
  }
}

/* =====================================================================
   12b. MINIFASES DOS DESTINOS DO DADO COM INTELIGENCIA
   Fases curtas e faceis: cada destino escolhido tem a sua.
   ===================================================================== */
var MINI = null;
var MINI_KIND = { 'd-crm': 'crm', 'd-gads': 'ads', 'd-meta': 'ads', 'd-ctx': 'contexto', 'd-dash': 'dash', 'd-nproj': 'comet' };
/* contexto ativo: o que o comportamento de navegacao torna relevante AGORA */
var CTX_CENAS = [
  ['NAVEGANDO EM CREDITO',   ['SIMULOU EMPRESTIMO', 'VIU AS TAXAS', 'CALCULOU PARCELA']],
  ['NAVEGANDO EM VIAGEM',    ['COTOU CAMBIO', 'BUSCOU PASSAGEM', 'VIU SEGURO VIAGEM']],
  ['NAVEGANDO EM INVESTIR',  ['ABRIU CDB', 'VIU RENDA FIXA', 'SIMULOU APORTE']],
  ['NAVEGANDO EM CARTAO',    ['VIU FATURA', 'PEDIU LIMITE', 'COMPAROU CARTOES']]
];
var CTX_RUIDO = ['COMPRA DE 2021', 'BANNER IGNORADO', 'SESSAO EXPIRADA', 'CLIQUE ACIDENTAL', 'DADO DESATUALIZADO', 'PUSH NAO ABERTO'];
var MINI_TITLE = {
  crm:   ['CRM COGNITIVO', 'Leve o banner ate o cliente com o mesmo interesse'],
  ads:   ['ALGORITMO DE ADS', 'Capture SINAL e evite RUIDO para treinar o modelo'],
  contexto: ['CONTEXTO ATIVO', 'Pegue o sinal RELEVANTE do momento'],
  dash:  ['DASHBOARDS & ANALISES', 'Leve o plugue ate a tomada e ligue os paineis'],
  comet: ['N PROJETOS E PLATAFORMAS', 'Desvie dos dados ruins e acerte os tentaculos']
};
var CRM_PREF = [['VIAGEM', '#4fdcff'], ['GAMES', '#c084fc'], ['ESPORTE', '#7ef29d']];
var COMET_LABELS = ['NULL', 'DUPLICADO', 'SCHEMA DRIFT', 'OUTLIER', 'DADO SUJO', 'LATE EVENT'];

function miniFY() { return playFloorY() - 2; }
function fx2x(fx, w) { return Math.round(VIEWW * fx) - Math.round((w || 0) / 2); }

function miniStart(kind) {
  var M = {
    kind: kind, t: 0, got: 0, goal: 4, ok: 0, cur: 0, nopeT: 0, flash: 0,
    x: 24, y: 0, vx: 0, vy: 0, onG: false, face: 1, anim: 0,
    items: [], carry: null, bar: 0, sockets: [], clients: [],
    hp: 3, inv: 0, shots: [], boss: null, killed: 0, stars: []
  };
  var i;
  M.y = miniFY() - P.h;
  if (kind === 'crm') {
    M.goal = 4;
    for (i = 0; i < 3; i++) M.clients.push({ fx: 0.26 + i * 0.24, pref: i });
    M.cur = 1;
  } else if (kind === 'ads') {
    M.goal = 100;
  } else if (kind === 'contexto') {
    M.goal = 4; M.cur = 0;
  } else if (kind === 'dash') {
    M.goal = 3;
    for (i = 0; i < 3; i++) M.sockets.push({ fx: 0.34 + i * 0.22, on: false });
  } else if (kind === 'comet') {
    M.goal = 8; M.x = 40; M.y = 120;
    for (i = 0; i < 90; i++) M.stars.push({ x: Math.random() * 900, y: Math.random() * 400, z: 0.4 + Math.random() * 2 });
  }
  MINI = M;
  state = 'mini';
  toast(MINI_TITLE[kind][0], '#4fdcff');
}
function miniWin() {
  if (MINI.ok) return;
  MINI.ok = 1; MINI.okT = 0;
  track('minigame_complete', { minigame: MINI.kind, segundos: Math.round(MINI.t / 60) });
  SFX.victory();
  burst(MINI.x + 6, MINI.y, 40, '#ffe14d', 3);
  game.score += 2500;
}
function miniFinish() {
  MINI = null;
  if (game.dest !== null && DESTS[game.dest][0] === 'd-nproj') { state = 'q42'; SFX.boost(); }
  else { state = 'win'; fimDeJogo('win'); }
}
/* evento de conclusao: o retrato completo da run em um unico hit */
function fimDeJogo(tipo) {
  track('game_complete', {
    final: tipo,
    score: game.score,
    tags: game.tagsGot,
    tags_total: game.tagsTotal,
    schema: game.schema + '/' + game.schemaTotal,
    rota: game.route || 'nenhuma',
    destino: game.dest !== null ? DESTS[game.dest][1] : 'nenhum',
    finops_brl: game.finopsSave || 0,
    falhas: game.deaths,
    minutos: Math.round((Date.now() - RUN_T0) / 6000) / 10
  });
}

function miniUpdate() {
  var M = MINI;
  M.t++;
  readInput();
  if (M.ok) { M.okT++; if (M.okT > 90) miniFinish(); return; }
  if (M.kind === 'comet') { miniComet(); return; }
  miniWalker();
  if (M.kind === 'crm') miniCRM();
  else if (M.kind === 'ads') miniADS();
  else if (M.kind === 'contexto') miniCTX();
  else if (M.kind === 'dash') miniDASH();
}

function miniWalker() {
  var M = MINI, FY = miniFY(), sp = 2.9;
  if (IN.left) { M.vx -= 0.62; M.face = -1; }
  if (IN.right) { M.vx += 0.62; M.face = 1; }
  if (!IN.left && !IN.right) M.vx *= 0.80;
  if (M.vx > sp) M.vx = sp;
  if (M.vx < -sp) M.vx = -sp;
  if (Math.abs(M.vx) < 0.05) M.vx = 0;
  if (jumpEdge && M.onG) { M.vy = JUMPV; M.onG = false; SFX.jump(); }
  if (!IN.jump && M.vy < -2.6) M.vy = -2.6;
  M.vy += GRAV;
  if (M.vy > MAXFALL) M.vy = MAXFALL;
  M.x += M.vx; M.y += M.vy;
  if (M.y + P.h >= FY) { M.y = FY - P.h; M.vy = 0; M.onG = true; }
  if (M.x < 6) { M.x = 6; M.vx = 0; }
  if (M.x + P.w > VIEWW - 6) { M.x = VIEWW - 6 - P.w; M.vx = 0; }
  M.anim += Math.abs(M.vx);
}
function miniGrounded() { return MINI.y + P.h >= miniFY() - 4; }

function miniCRM() {
  var M = MINI;
  if (M.nopeT > 0) M.nopeT--;
  if (M.flash > 0) M.flash--;
  if (Math.abs(M.vx) > 0.8 || !miniGrounded()) return;
  for (var i = 0; i < M.clients.length; i++) {
    var c = M.clients[i], cx = fx2x(c.fx, 20);
    if (M.x + P.w < cx || M.x > cx + 20) continue;
    if (c.pref === M.cur) {
      M.got++; M.flash = 26; game.score += 400 * 1;
      SFX.ok(); burst(cx + 10, miniFY() - 30, 16, CRM_PREF[c.pref][1], 2.2);
      M.cur = (M.cur + 1 + (M.got % 2)) % 3;
      if (M.got >= M.goal) miniWin();
    } else if (M.nopeT === 0) {
      M.nopeT = 46; SFX.nope();
    }
    break;
  }
}

function miniADS() {
  var M = MINI, FY = miniFY(), i;
  if (M.t % 26 === 0) {
    var n = M.t / 26;
    M.items.push({
      x: 16 + ((n * 97) % Math.max(1, VIEWW - 60)), y: -16,
      vy: 1.5 + ((n * 37) % 7) * 0.09, good: (n % 4) !== 3
    });
  }
  for (i = M.items.length - 1; i >= 0; i--) {
    var it = M.items[i];
    it.y += it.vy;
    if (it.y > FY) { M.items.splice(i, 1); continue; }
    if (M.x + P.w > it.x && M.x < it.x + 36 && M.y + P.h > it.y && M.y < it.y + 18) {
      if (it.good) { M.bar = Math.min(100, M.bar + 15); SFX.collect(); game.score += 150; }
      else { M.bar = Math.max(0, M.bar - 8); SFX.nope(); }
      burst(it.x + 15, it.y + 7, 9, it.good ? '#7ef29d' : '#ff4d6d', 1.8);
      M.items.splice(i, 1);
    }
  }
  if (M.bar >= 100) miniWin();
}

/* CONTEXTO ATIVO: o comportamento de navegacao define o que e relevante agora.
   Entre todos os sinais que caem, so o que casa com o contexto atual
   pode ser levado para a interacao em andamento. */
function miniCTX() {
  var M = MINI, FY = miniFY(), i;
  var cena = CTX_CENAS[M.cur % CTX_CENAS.length];
  if (M.t % 30 === 0) {
    var n = M.t / 30;
    var rel = (n % 3) !== 2;
    var lab = rel ? cena[1][n % cena[1].length] : CTX_RUIDO[n % CTX_RUIDO.length];
    M.items.push({
      x: 12 + ((n * 113) % Math.max(1, VIEWW - 150)), y: -22,
      vy: 1.4 + ((n * 29) % 5) * 0.1, rel: rel, hot: rel, label: lab
    });
  }
  for (i = M.items.length - 1; i >= 0; i--) {
    var it = M.items[i];
    it.y += it.vy;
    if (it.y > FY) { M.items.splice(i, 1); continue; }
    if (!M.carry && M.x + P.w > it.x && M.x < it.x + 56 && M.y + P.h > it.y && M.y < it.y + 20) {
      if (it.rel) { M.carry = it.label; SFX.pick(); }
      else { SFX.nope(); M.nopeT = 40; game.score = Math.max(0, game.score - 50); }
      M.items.splice(i, 1);
    }
  }
  var dx = fx2x(0.86, 44);
  if (M.carry && Math.abs(M.vx) < 0.8 && miniGrounded() && M.x + P.w > dx && M.x < dx + 44) {
    M.carry = null; M.got++; SFX.ok(); game.score += 400;
    burst(dx + 22, FY - 22, 16, '#ffe14d', 2.2);
    M.flash = 24;
    if (M.got >= M.goal) miniWin();
    else { M.cur++; M.items.length = 0; }      // novo contexto: nova relevancia
  }
  if (M.nopeT > 0) M.nopeT--;
  if (M.flash > 0) M.flash--;
}

function miniDASH() {
  var M = MINI, i;
  var px = fx2x(0.08, 16);
  if (!M.carry && M.x + P.w > px && M.x < px + 18 && miniGrounded()) { M.carry = 1; SFX.pick(); }
  if (!M.carry) return;
  for (i = 0; i < M.sockets.length; i++) {
    var s = M.sockets[i];
    if (s.on) continue;
    var sx = fx2x(s.fx, 22);
    if (M.x + P.w > sx && M.x < sx + 22 && Math.abs(M.vx) < 0.8 && miniGrounded()) {
      s.on = true; M.carry = null; M.got++; SFX.ok(); game.score += 500;
      burst(sx + 11, miniFY() - 16, 18, '#7ef29d', 2.2);
      if (M.got >= M.goal) miniWin();
      break;
    }
  }
}

function miniComet() {
  var M = MINI, i, j;
  // nave flutuante: arraste o dedo (ou setas) para pilotar em qualquer direcao
  var loY = 34, hiY = VIEWH - 26, loX = 8, hiX = VIEWW * 0.62;
  if (FLY.drag) {
    var tx = Math.max(loX, Math.min(hiX, FLY.tx - 17));
    var ty = Math.max(loY, Math.min(hiY, FLY.ty - 9));
    M.vx += (tx - M.x) * 0.10;
    M.vy += (ty - M.y) * 0.10;
  } else {
    if (IN.jump) M.vy -= 0.42;
    if (IN.down) M.vy += 0.42;
    if (IN.left) M.vx -= 0.42;
    if (IN.right) M.vx += 0.42;
  }
  M.vx *= 0.86; M.vy *= 0.86;             // sem gravidade: a nave flutua
  M.vy = Math.max(-4.2, Math.min(4.2, M.vy));
  M.vx = Math.max(-3.6, Math.min(3.6, M.vx));
  M.x += M.vx; M.y += M.vy;
  M.y = Math.max(loY, Math.min(hiY, M.y));
  M.x = Math.max(loX, Math.min(hiX, M.x));
  if (M.inv > 0) M.inv--;

  if (M.t % 16 === 0) { M.shots.push({ x: M.x + 30, y: M.y + 6 }); tone(900, AU.ready ? AU.ctx.currentTime : 0, 0.05, 'square', 0.06, 1400); }
  for (i = M.shots.length - 1; i >= 0; i--) {
    M.shots[i].x += 5.4;
    if (M.shots[i].x > VIEWW + 10) M.shots.splice(i, 1);
  }
  // cometas de dados ruins
  if (!M.boss && M.t % 46 === 0) {
    var n = M.t / 46;
    M.items.push({
      x: VIEWW + 24, y: 40 + ((n * 71) % Math.max(1, VIEWH - 110)),
      vx: -(1.4 + ((n * 13) % 5) * 0.16), label: COMET_LABELS[n % COMET_LABELS.length], hp: 1
    });
  }
  for (i = M.items.length - 1; i >= 0; i--) {
    var c = M.items[i];
    c.x += c.vx;
    if (c.x < -70) { M.items.splice(i, 1); continue; }
    for (j = M.shots.length - 1; j >= 0; j--) {
      var s = M.shots[j];
      if (s.x > c.x && s.x < c.x + 22 && s.y > c.y && s.y < c.y + 18) {
        M.shots.splice(j, 1); M.items.splice(i, 1);
        M.killed++; game.score += 200; SFX.stomp();
        burst(c.x + 11, c.y + 9, 12, '#ff8a5c', 2.2);
        break;
      }
    }
    if (M.items[i] === c && M.inv === 0 &&
        M.x + 34 > c.x && M.x < c.x + 22 && M.y + 20 > c.y && M.y < c.y + 18) {
      M.items.splice(i, 1); miniHit();
    }
  }
  // boss
  if (!M.boss && M.killed >= M.goal) {
    var bh = Math.min(96, Math.max(74, Math.round(VIEWH * 0.40)));
    M.boss = {
      x: VIEWW + 80, y: Math.round(VIEWH / 2 - bh / 2), w: 62, h: bh,
      t: 0, vy: 0.7, shots: [], dying: 0, mb: [],
      tent: [
        { n1: 'QUEDA NO', n2: 'TAGUEAMENTO', hp: 4, max: 4, hit: 0, dead: 0, col: '#ffb020' },
        { n1: 'O PIPELINE DE', n2: 'DADOS CAIU', hp: 4, max: 4, hit: 0, dead: 0, col: '#4fdcff' },
        { n1: 'O ALGORITMO NAO', n2: 'PERFORMOU BEM', hp: 4, max: 4, hit: 0, dead: 0, col: '#ff5f8f' }
      ]
    };
    toast('MONSTRO DE ESPAGUETE · DESTRUA OS 3 TENTACULOS', '#ff4d6d');
    SFX.error();
  }
  var B = M.boss;
  if (B) {
    B.t++;
    for (i = 0; i < B.tent.length; i++) if (B.tent[i].hit > 0) B.tent[i].hit--;

    if (B.dying) {                       // animacao de morte do monstro
      B.dying++;
      if (B.dying % 3 === 0) {
        var ax = B.x + Math.random() * B.w, ay = B.y + Math.random() * B.h;
        parts.push({ x: ax, y: ay, vx: (Math.random() - 0.5) * 2.4, vy: -1 - Math.random() * 2,
                     life: 50, t: 0, c: Math.random() < 0.5 ? '#e8d9a8' : '#8a4a2a', g: 0.10 });
      }
      for (i = 0; i < B.mb.length; i++) {
        var mb = B.mb[i];
        mb.vy += 0.13; mb.x += mb.vx; mb.y += mb.vy; mb.rot += mb.vx * 0.08;
        var chao = VIEWH - 24;
        if (mb.y > chao) { mb.y = chao; mb.vy *= -0.45; mb.vx *= 0.86; if (Math.abs(mb.vy) < 0.6) mb.vy = 0; }
      }
      if (B.dying === 18) SFX.error();
      if (B.dying === 50) { burst(B.x + B.w / 2, B.y + B.h / 2, 46, '#e8d9a8', 3.2); SFX.stomp(); }
      if (B.dying > 132) { game.score += 4000; miniWin(); }
      return;
    }

    var tx = VIEWW - B.w - 14;
    if (B.x > tx) B.x -= 1.6;
    else {
      B.y += B.vy;
      if (B.y < 26 || B.y + B.h > playFloorY() - 8) B.vy *= -1;
      if (B.t % 54 === 0) { B.shots.push({ x: B.x - 6, y: B.y + 18 + (B.t % 3) * 22 }); SFX.nope(); }
    }
    for (i = B.shots.length - 1; i >= 0; i--) {
      var bs = B.shots[i];
      bs.x -= 2.6;
      if (bs.x < -20) { B.shots.splice(i, 1); continue; }
      if (M.inv === 0 && M.x + 34 > bs.x && M.x < bs.x + 14 && M.y + 20 > bs.y && M.y < bs.y + 12) {
        B.shots.splice(i, 1); miniHit();
      }
    }
    // almondegas x tentaculos
    for (j = M.shots.length - 1; j >= 0; j--) {
      var sh = M.shots[j], acertou = false;
      for (i = 0; i < B.tent.length && !acertou; i++) {
        var T2 = B.tent[i];
        if (T2.dead) continue;
        var pts = tentPoints(B, i);
        for (var k2 = 0; k2 < pts.length; k2++) {
          if (Math.abs(sh.x + 4 - pts[k2].x) < 9 && Math.abs(sh.y + 3 - pts[k2].y) < 9) {
            acertou = true;
            T2.hp--; T2.hit = 10;
            burst(pts[k2].x, pts[k2].y, 8, '#e8d9a8', 2.2);
            SFX.stomp();
            if (T2.hp <= 0) {
              T2.dead = 1;
              burst(pts[4].x, pts[4].y, 26, T2.col, 2.8);
              game.score += 1200;
              toast('TENTACULO DESTRUIDO: ' + T2.n1 + ' ' + T2.n2, T2.col);
              SFX.ok();
              if (tentVivos(B) === 0) {
                B.dying = 1;
                B.mb = [
                  { x: B.x + 12, y: B.y + B.h * 0.34, vx: -2.2, vy: -3.6, rot: 0, r: 13 },
                  { x: B.x + 34, y: B.y + B.h * 0.52, vx: -1.3, vy: -4.4, rot: 0, r: 15 }
                ];
                toast('MONSTRO DE ESPAGUETE DERROTADO!', '#7ef29d');
              }
            }
            break;
          }
        }
      }
      if (!acertou && sh.x > B.x && sh.x < B.x + B.w && sh.y > B.y && sh.y < B.y + B.h) {
        acertou = true;                   // corpo protegido enquanto houver tentaculo
        burst(sh.x, sh.y, 4, '#9fb0c4', 1.4);
      }
      if (acertou) M.shots.splice(j, 1);
    }
    if (M.inv === 0 && M.x + 34 > B.x && M.x < B.x + B.w && M.y + 20 > B.y && M.y < B.y + B.h) miniHit();
  }
}
function tentPoints(B, i) {
  var pts = [], baseY = B.y + 16 + i * ((B.h - 26) / 2), baseX = B.x + 8;
  for (var k = 0; k < 9; k++) {
    pts.push({
      x: baseX - k * 8,
      y: baseY + Math.sin(B.t * 0.07 + k * 0.55 + i * 1.7) * (2 + k * 0.9)
    });
  }
  return pts;
}
function tentVivos(B) {
  var n = 0;
  for (var i = 0; i < B.tent.length; i++) if (!B.tent[i].dead) n++;
  return n;
}
function miniHit() {
  var M = MINI;
  M.hp--; M.inv = 70; SFX.error();
  burst(M.x + 16, M.y + 10, 18, '#ff4d6d', 2.4);
  if (M.hp <= 0) {
    M.hp = 3; M.inv = 90; M.items.length = 0; M.shots.length = 0;
    M.boss = null; M.killed = 0; M.t = 0; M.x = 40; M.y = 120; M.vx = 0; M.vy = 0;
    toast('PIPELINE RESETADO · TENTE DE NOVO', '#ffb020');
  }
}

/* ---------------- desenho das minifases ---------------- */

function miniHeader() {

      r(VIEWW / 2 - hw2 / 2, 34, hw2, 13, 'rgba(10,20,34,0.9)');

      txt(hint, VIEWW / 2, 36, 7, '#9fe8ff', 'center', false);
      ctx.globalAlpha = 1;
    }
    for (var i = 0; i < 3; i++) {

/* almondega em pixel art (projetil da nave e cabeca do monstro) */
function meatball(cx, cy, rad, seed) {
  for (var yy = -rad; yy <= rad; yy++) {
    var hw = Math.round(Math.sqrt(Math.max(0, rad * rad - yy * yy)));
    r(cx - hw, cy + yy, hw * 2, 1, yy < -rad * 0.35 ? '#a35c33' : (yy < rad * 0.35 ? '#8a4a2a' : '#63321b'));
  }
  // grumos
  var g = Math.floor(seed || 0);
  r(cx - rad * 0.5, cy - rad * 0.4, Math.max(1, rad * 0.35), Math.max(1, rad * 0.3), '#b9713f');
  r(cx + rad * 0.1, cy - rad * 0.1, Math.max(1, rad * 0.3), Math.max(1, rad * 0.3), '#6f3a20');
  r(cx - rad * 0.2, cy + rad * 0.35, Math.max(1, rad * 0.3), Math.max(1, rad * 0.25), '#7d4124');
  r(cx - rad * 0.55 + (g % 2), cy - rad * 0.6, Math.max(1, rad * 0.25), 1, '#c98a55');
}

/* Monstro de Espaguete Voador: 3 tentaculos nomeados que a nave precisa
   destruir com almondegas. Sem tentaculos, ele se desfaz. */
function drawSpaghettiBoss(B) {
  var i, k, PA = '#e8d9a8', PAL = '#f7edc9', PAD = '#b39a63';
  var morrendo = B.dying > 0;
  var sway = morrendo ? Math.sin(B.dying * 0.5) * 3 : 0;
  var bx = B.x + sway, by = B.y;


  // ---- tentaculos nomeados (macarrao)
  for (i = 0; i < B.tent.length; i++) {
    var T = B.tent[i];
    var pts = tentPoints(B, i);
    for (k = 0; k < pts.length; k++) { pts[k].x += sway; }
    if (T.dead) {
      // coto queimado
      r(pts[0].x - 6, pts[0].y - 2, 10, 5, '#6b5a34');
      r(pts[0].x - 6, pts[0].y - 2, 10, 1, '#8a7644');
      continue;
    }
    var flash = T.hit > 0 && (T.hit % 4 < 2);
    // macarrao continuo: interpola entre os pontos
    for (k = pts.length - 1; k > 0; k--) {
      for (var ss = 0; ss < 4; ss++) {
        var f2 = ss / 4;
        var px4 = pts[k].x + (pts[k - 1].x - pts[k].x) * f2;
        var py4 = pts[k].y + (pts[k - 1].y - pts[k].y) * f2;
        var wdt = 7 - (k - f2) * 0.42;
        r(px4 - wdt / 2, py4 - wdt / 2, wdt + 1, wdt, flash ? '#ffffff' : PA);
        if (ss === 0) {
          r(px4 - wdt / 2, py4 - wdt / 2, wdt + 1, 1, flash ? '#ffffff' : PAL);
          r(px4 - wdt / 2, py4 + wdt / 2 - 1, wdt + 1, 1, PAD);
        }
      }
    }
    // ponta com ventosa
    var tip = pts[pts.length - 1];
    r(tip.x - 4, tip.y - 3, 6, 6, flash ? '#ffffff' : T.col);
    r(tip.x - 3, tip.y - 2, 4, 4, '#2a2010');
    // placa com o nome da falha
    var lw = Math.max(tw(T.n1, 5), tw(T.n2, 5)) + 8;
    var lx = tip.x - lw + 4, ly = tip.y - 26;
    if (lx < 2) lx = 2;
    r(lx, ly, lw, 17, 'rgba(10,8,20,0.92)');
    r(lx, ly, lw, 1, T.col);
    txt(T.n1, lx + lw / 2, ly + 2, 5, T.col, 'center', false);
    txt(T.n2, lx + lw / 2, ly + 9, 5, T.col, 'center', false);
    // vida do tentaculo
    r(lx, ly + 18, lw, 4, '#241a2c');
    r(lx, ly + 18, lw * T.hp / T.max, 4, T.col);
  }

  // ---- novelo de espaguete (silhueta arredondada)
  for (i = 0; i < 16; i++) {
    var oy = by + 4 + (i * (B.h - 8) / 16);
    var dist = Math.abs(i - 7.5) / 7.5;
    var inset = Math.round(dist * dist * (B.w * 0.42));
    var x0n = bx + inset, wn = B.w - inset * 2;
    if (morrendo) {                       // o novelo se desenrola e escorre
      var dz = B.dying;
      x0n += (i % 2 ? -1 : 1) * dz * (0.5 + (i % 4) * 0.22);
      oy += dz * (0.35 + (i % 3) * 0.22);
      ctx.globalAlpha = Math.max(0, 1 - dz / 110);
      if (oy > VIEWH + 20) { ctx.globalAlpha = 1; continue; }
    }
    if (wn < 8) continue;
    for (k = 0; k < Math.ceil(wn / 7); k++) {
      var nx = x0n + k * 7;
      if (nx + 7 > x0n + wn) break;
      var ny = oy + Math.sin(B.t * 0.05 + k * 0.7 + i) * 1.6;
      r(nx, ny, 8, 3, i % 2 ? PA : PAL);
      r(nx, ny + 2, 8, 1, PAD);
    }
    // fios soltos saindo do novelo
    if (i % 4 === 1) {
      var lo = x0n - 8 - Math.round(Math.sin(B.t * 0.05 + i) * 3);
      r(lo, oy + 1, 9, 3, PA);
      r(lo, oy + 3, 9, 1, PAD);
      r(x0n + wn - 1, oy + 1, 9, 3, PA);
      r(x0n + wn - 1, oy + 3, 9, 1, PAD);
    }
    ctx.globalAlpha = 1;
  }

  // ---- almondegas (cabeca)
  if (!morrendo) {
    meatball(bx + 18, by + B.h * 0.34, 13, B.t * 0.1);
    meatball(bx + 42, by + B.h * 0.56, 15, B.t * 0.13);
  } else {
    for (i = 0; i < B.mb.length; i++) {
      var mb = B.mb[i];
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, B.dying - 78) / 44);
      meatball(mb.x, mb.y, mb.r, mb.rot * 4);
      // fio de macarrao pendurado na almondega
      r(mb.x - 2, mb.y - mb.r - 4 + Math.sin(mb.rot * 3) * 2, 5, 3, PA);
      ctx.globalAlpha = 1;
    }
  }

  // ---- olhos em hastes
  var droop = morrendo ? Math.min(16, B.dying * 0.3) : 0;
  for (i = 0; i < 2; i++) {
    var ex = bx + 16 + i * 26, ey = by - 20 + droop + Math.sin(B.t * 0.06 + i) * 2;
    r(ex + 2, ey + 6, 3, 22, PA);
    r(ex + 2, ey + 6, 1, 22, PAL);
    r(ex - 2, ey - 4, 11, 11, '#f4efe2');
    r(ex - 1, ey - 3, 9, 9, '#ffffff');
    r(ex + 2, ey, morrendo ? 5 : 4, morrendo ? 2 : 5, '#2a2438');
    if (!morrendo) r(ex + 3, ey + 1, 2, 2, '#0d0a16');
  }

  // ---- rotulo geral
  if (!morrendo) {
    var vivos = tentVivos(B);
    var w5 = tw('MONSTRO DE ESPAGUETE', 7) + 14;
    var lcx = Math.max(w5 / 2 + 3, Math.min(VIEWW - w5 / 2 - 3, bx + B.w / 2));
    r(lcx - w5 / 2, by - 40, w5, 12, 'rgba(10,8,20,0.9)');
    r(lcx - w5 / 2, by - 40, w5, 1, '#ff4d6d');
    txt('MONSTRO DE ESPAGUETE', lcx, by - 38, 7, '#ffd0a8', 'center', false);
    txt('TENTACULOS ' + vivos + '/3', lcx, by - 52, 7, '#ff9db0', 'center');
  } else if (B.dying > 55) {
    var acx = Math.max(60, Math.min(VIEWW - 60, bx + B.w / 2));
    ctx.globalAlpha = Math.min(1, (B.dying - 55) / 14);
    txt('AL DENTE.', acx, Math.max(40, by + B.h / 2), 16, '#ffe14d', 'center');
    ctx.globalAlpha = 1;
  }

  // ---- projeteis do monstro
  for (i = 0; i < B.shots.length; i++) {
    var bs = B.shots[i];
    for (k = 0; k < 3; k++) r(bs.x + k * 5, bs.y + Math.sin(B.t * 0.3 + k) * 2, 6, 3, k % 2 ? PA : PAD);
    r(bs.x + 2, bs.y - 4, 9, 4, '#c92b45');
    txt('!', bs.x + 6, bs.y - 4, 6, '#ffe0e6', 'center', false);
  }
}

function miniDrawComet() {
  var M = MINI, i;
  ctx.fillStyle = '#060417';
  ctx.fillRect(0, 0, VIEWW, VIEWH);
  for (i = 0; i < M.stars.length; i++) {
    var s = M.stars[i];
    s.x -= s.z * 1.1;
    if (s.x < -6) { s.x = VIEWW + Math.random() * 30; s.y = Math.random() * VIEWH; }
    r(s.x % (VIEWW + 30), s.y % VIEWH, s.z > 1.6 ? 3 : 2, 1, s.z > 1.6 ? '#ffffff' : '#9fb6d8');
  }
  // almondegas disparadas pela nave
  for (i = 0; i < M.shots.length; i++) {
    var sx0 = M.shots[i].x, sy0 = M.shots[i].y - 2;
    ctx.globalAlpha = 0.35;
    r(sx0 - 7, sy0 + 2, 8, 3, '#8a4a2a');
    ctx.globalAlpha = 1;

  // cometas de dados ruins
  for (i = 0; i < M.items.length; i++) {
    var c = M.items[i];
    ctx.globalAlpha = 0.5;
    r(c.x + 20, c.y + 4, 26, 3, '#8a4a2a');

    txt(c.label, c.x + 11, c.y - 10, 6, '#ffb98a', 'center');
  }
  // ---- MONSTRO DE ESPAGUETE
  var B = M.boss;
  if (B) drawSpaghettiBoss(B);
  // nave da engenheira
  if (!(M.inv > 0 && Math.floor(M.inv / 4) % 2 === 0)) {
    var sx2 = M.x, sy2 = M.y;
    var fl = 3 + ((M.t / 3 | 0) % 3) * 2;
    r(sx2 - 8 - fl, sy2 + 6, 10 + fl, 7, '#ff7a3c');
    r(sx2 - 4 - fl * 0.6, sy2 + 8, 8 + fl * 0.6, 3, '#ffe14d');
    box3(sx2 + 10, sy2 - 5, 16, 5, '#7f90a8', '#b7c8dc', '#455266');
    box3(sx2 + 10, sy2 + 19, 16, 5, '#7f90a8', '#b7c8dc', '#455266');
    box3(sx2, sy2 + 1, 34, 18, '#c9d6e6', '#ffffff', '#6b7c93');
    for (var b2 = 0; b2 < 9; b2++) r(sx2 + 34 + b2, sy2 + 1 + b2 * 0.85, 1, Math.max(2, 18 - b2 * 1.8), b2 < 5 ? '#dfe7f2' : '#b0bfd2');
    r(sx2 + 18, sy2 + 4, 12, 9, '#0e1a2a');
    r(sx2 + 19, sy2 + 5, 10, 7, '#4fdcff');
    r(sx2 + 20, sy2 + 6, 4, 5, '#e0374f');
    r(sx2 + 20, sy2 + 6, 4, 2, '#3a2416');
    r(sx2 + 4, sy2 + 5, 10, 4, '#e0374f');
    r(sx2 + 4, sy2 + 12, 8, 3, '#ffb020');
  }
}

function drawPad() {
  if (!padActive()) return;
  var L = padLayout();
  function btn(rc, label, pressed, accent) {
    var x = rc.x, y = rc.y, w = rc.w, h = rc.h;
    ctx.globalAlpha = pressed ? 0.95 : 0.62;
    ctx.fillStyle = '#05070f'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = pressed ? accent : 'rgba(22,38,60,0.9)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = pressed ? 'rgba(255,255,255,0.35)' : 'rgba(130,180,230,0.35)';
    ctx.fillRect(x, y, w, 3); ctx.fillRect(x, y, 3, h);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x, y + h - 3, w, 3); ctx.fillRect(x + w - 3, y, 3, h);
    // o texto se ajusta a largura do botao: em telas estreitas "PULAR ▲" vazava
    var fs = Math.round(h * 0.34), limite = w - Math.max(12, w * 0.18);
    ctx.font = 'bold ' + fs + 'px "Courier New",monospace';
    while (fs > 10 && ctx.measureText(label).width > limite) {
      fs--;
      ctx.font = 'bold ' + fs + 'px "Courier New",monospace';
    }
    // ultimo recurso em tela muito estreita: encurta o rotulo em vez de vazar
    if (ctx.measureText(label).width > limite && label.length > 2) {
      label = label.replace(' ▲', '').replace(' ', '');
      while (fs > 8 && ctx.measureText(label).width > limite) {
        fs--;
        ctx.font = 'bold ' + fs + 'px "Courier New",monospace';
      }
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = pressed ? '#05070f' : '#e2f4ff';
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    ctx.textBaseline = 'top';
    ctx.globalAlpha = 1;
  }
  btn(L.left, '◄', PAD.left || KEY.left, '#39d3ff');
  btn(L.right, '►', PAD.right || KEY.right, '#39d3ff');
  btn(L.jump, 'PULAR ▲', PAD.jump || KEY.jump, '#ffe14d');
}

function drawSpace() {
  var t = game.spaceT;
  ctx.fillStyle = '#05030f';
  ctx.fillRect(0, 0, VIEWW, VIEWH);
  // nebulosas (blocos sobrepostos com alfa baixo)
  var neb = ['#5b2f8f', '#2f4f8f', '#8f2f6a', '#2f8f7a'];
  for (var n = 0; n < 4; n++) {
    var nx = (n * 191 + t * 0.35) % (VIEWW + 260) - 130;
    var ny = 24 + n * 46;
    for (var q3 = 0; q3 < 7; q3++) {
      ctx.globalAlpha = 0.05 + (q3 % 3) * 0.02;
      var sw = 92 - q3 * 9;
      r(nx + q3 * 7 - 10, ny + Math.sin(q3 * 1.7 + n) * 12, sw, 30 - q3 * 2, neb[n]);
    }
  }
  ctx.globalAlpha = 1;
  // estrelas
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    s.x -= s.z * 1.6;
    if (s.x < -4) { s.x = VIEWW + Math.random() * 40; s.y = Math.random() * VIEWH; }
    var len = Math.min(14, s.z * (t < 150 ? 5 : 2));
    r(s.x % (VIEWW + 40), s.y % VIEWH, len, Math.max(1, s.z > 2 ? 2 : 1), s.c);
  }
  // planeta com aneis
  var pcx = VIEWW + 70 - ((t * 0.42) % (VIEWW + 320));
  var pr2 = 30;
  r(pcx - 46, 66, 92, 3, '#8c6a3f');
  for (var yy = -pr2; yy <= pr2; yy++) {
    var hw = Math.round(Math.sqrt(pr2 * pr2 - yy * yy));
    r(pcx - hw, 60 + yy, hw * 2, 1, yy < -8 ? '#f0b878' : (yy < 8 ? '#dc9a54' : '#b87a3c'));
  }
  r(pcx - 16, 46, 18, 4, '#f7d3a4');
  r(pcx - 4, 68, 22, 3, '#a86a30');
  ctx.globalAlpha = 0.75;
  r(pcx - 52, 62, 104, 3, '#f3d9a8');
  ctx.globalAlpha = 1;

  // nave espacial pilotavel (nariz a direita, propulsao a esquerda)
  if (game.shipX === undefined) { game.shipX = VIEWW / 2 - 40; game.shipY = VIEWH / 2 - 11; game.shipVX = 0; game.shipVY = 0; }
  var loX2 = 6, hiX2 = VIEWW - 100, loY2 = 30, hiY2 = VIEWH - 60;
  if (FLY.drag) {
    game.shipVX += (Math.max(loX2, Math.min(hiX2, FLY.tx - 45)) - game.shipX) * 0.09;
    game.shipVY += (Math.max(loY2, Math.min(hiY2, FLY.ty - 11)) - game.shipY) * 0.09;
  } else {
    if (IN.jump) game.shipVY -= 0.5;
    if (IN.down) game.shipVY += 0.5;
    if (IN.left) game.shipVX -= 0.5;
    if (IN.right) game.shipVX += 0.5;
    if (!IN.jump && !IN.down && !IN.left && !IN.right) {
      game.shipVY += Math.sin(t * 0.04) * 0.06;      // flutuacao suave parada
      game.shipVX += Math.sin(t * 0.03) * 0.05;
    }
  }
  game.shipVX *= 0.88; game.shipVY *= 0.88;
  game.shipX = Math.max(loX2, Math.min(hiX2, game.shipX + game.shipVX));
  game.shipY = Math.max(loY2, Math.min(hiY2, game.shipY + game.shipVY));
  var sx = Math.round(game.shipX), sy = Math.round(game.shipY);
  // propulsao
  var fl = 4 + ((t / 3 | 0) % 3) * 3;
  r(sx - 10 - fl, sy + 8, 12 + fl, 10, '#ff7a3c');
  r(sx - 6 - fl * 0.7, sy + 10, 10 + fl * 0.7, 6, '#ffe14d');
  r(sx - 2 - fl * 0.4, sy + 11, 8, 4, '#fffbe0');
  ctx.globalAlpha = 0.35;
  r(sx - 26 - fl, sy + 10, 14, 6, '#ff7a3c');
  ctx.globalAlpha = 1;
  // asas
  box3(sx + 16, sy - 8, 26, 8, '#7f90a8', '#b7c8dc', '#455266');
  box3(sx + 16, sy + 26, 26, 8, '#7f90a8', '#b7c8dc', '#455266');
  // leme
  box3(sx - 2, sy - 4, 10, 10, '#8b9cb5', '#c3d2e4', '#4e5c72');
  // fuselagem
  box3(sx, sy + 2, 74, 24, '#c9d6e6', '#ffffff', '#6b7c93');
  r(sx + 2, sy + 4, 70, 3, '#eef4fb');
  r(sx + 2, sy + 21, 70, 3, '#9fb0c4');
  // bico
  for (var b3 = 0; b3 < 16; b3++) {
    var nh = Math.max(2, 24 - b3 * 1.5);
    r(sx + 74 + b3, sy + 2 + (24 - nh) / 2, 1, nh, b3 < 8 ? '#dfe7f2' : '#b0bfd2');
  }
  // cabine com o engenheiro
  r(sx + 44, sy + 5, 24, 15, '#0e1a2a');
  r(sx + 46, sy + 7, 20, 11, '#4fdcff');
  r(sx + 48, sy + 8, 8, 10, '#e0374f');
  r(sx + 49, sy + 8, 6, 4, '#f2c79a');
  r(sx + 49, sy + 8, 6, 2, '#3a2416');
  r(sx + 47, sy + 9, 2, 5, '#3a2416');          // cabelo longo
  r(sx + 50, sy + 10, 4, 1, '#1b2430');         // oculos
  r(sx + 58, sy + 10, 6, 7, '#123049');
  // faixas e placa 42
  r(sx + 10, sy + 6, 28, 5, '#e0374f');
  r(sx + 10, sy + 13, 20, 4, '#ffb020');
  r(sx + 10, sy + 19, 22, 6, '#0e1a2a');
  txt('42', sx + 21, sy + 19, 6, '#7ef29d', 'center', false);
  // luzes de navegacao
  r(sx + 20, sy + 34, 4, 3, ((t / 10 | 0) % 2) ? '#7ef29d' : '#1f5a3c');
  r(sx + 34, sy - 8, 4, 3, ((t / 10 | 0) % 2) ? '#ff5f8f' : '#5a1f33');
  // textos da odisseia
  var msg = null;
  if (t < 130) msg = ['42'];
  else if (t < 280) msg = ['A RESPOSTA PARA A QUESTAO FUNDAMENTAL', 'DA VIDA, DO UNIVERSO E DE TUDO MAIS.'];
  else if (t < 420) msg = ['NIVEL MAXIMO DE SABEDORIA COM DADOS.', 'NAO ENTRE EM PANICO.'];
  else msg = ['ATE MAIS, E OBRIGADO PELOS DADOS!'];
  var big = (t < 130);
  for (var m = 0; m < msg.length; m++) {
    txt(msg[m], VIEWW / 2, (big ? VIEWH / 2 - 60 : 26) + m * (big ? 30 : 12), big ? 26 : (VIEWW < 380 ? 7 : 9),
        big ? '#7ef29d' : '#dff3ff', 'center');
  }
  if (t > 420) {
    txt('SCORE FINAL: ' + game.score, VIEWW / 2, 44, VIEWW < 380 ? 8 : 10, '#ffe14d', 'center');
    bigButton('again', 'JOGAR NOVAMENTE', VIEWH - 46, Math.min(220, VIEWW - 40), 28, '#3ddc72');
  }
  if (t === 421) SFX.victory();
}

function drawWin() {
  ctx.fillStyle = 'rgba(6,20,34,0.92)';
  ctx.fillRect(0, 0, VIEWW, VIEWH);
  scan('#7ef29d');
  var narrow = VIEWW < 380;
  var d = DESTS[game.dest === null ? 0 : game.dest];
  var top = Math.max(8, Math.round(VIEWH / 2 - 104));
  txt('VITORIA EPICA', VIEWW / 2, top, narrow ? 15 : 19, '#ffe14d', 'center');
  txt('DO PIPELINE!', VIEWW / 2, top + 19, narrow ? 15 : 19, '#ffe14d', 'center');
  txt('DESTINO: ' + d[1], VIEWW / 2, top + 42, narrow ? 8 : 9, d[2], 'center');
  for (var m = 0; m < d[3].length; m++) txt(d[3][m], VIEWW / 2, top + 56 + m * 11, narrow ? 7 : 8, '#dff3ff', 'center');

  var rot = game.route === 'realtime' ? 'REAL-TIME (TUNEL 0ms)' : 'DATA MESH AWS (GLUE/SFN/S3)';
  var rows = [
    ['SCORE FINAL', String(game.score)],
    ['MULTIPLICADOR', game.mult + 'x (AI BOOST)'],
    ['EVENTOS MAPEADOS', game.tagsGot + ' / ' + game.tagsTotal],
    ['SCHEMA DATALAYER', game.schema + ' / ' + game.schemaTotal],
    ['CUSTO OTIMIZADO (FINOPS)', moeda(game.finopsSave || 0)],
    ['ROTA ORQUESTRADA', rot],
    [narrow ? 'FALHAS TAG/PIPE/ALGO' : 'FALHAS DE TAGUEAMENTO/PIPELINE/ALGORITMO', String(game.deaths)]
  ];
  var w = Math.min(330, VIEWW - 24), x = VIEWW / 2 - w / 2;
  var ry = top + 58 + d[3].length * 11;
  // o passo das linhas encolhe para o botao nunca cobrir a ultima linha
  var livre = VIEWH - 38 - ry;
  var passoL = Math.max(11, Math.min(16, Math.floor(livre / rows.length)));
  var fonteL = passoL < 13 ? 7 : (narrow ? 7 : 8);
  for (var i = 0; i < rows.length; i++) {
    var y = ry + i * passoL;
    r(x, y, w, passoL - 2, i % 2 ? 'rgba(14,28,46,0.85)' : 'rgba(22,40,62,0.85)');
    txt(rows[i][0], x + 8, y + 2, fonteL, '#a8bdd6');
    txt(rows[i][1], x + w - 8, y + 2, fonteL, '#ffe14d', 'right');
  }
  var ey = ry + rows.length * passoL + 5;
  bigButton('again', 'JOGAR NOVAMENTE', Math.min(ey, VIEWH - 34), Math.min(220, VIEWW - 40), 28, '#3ddc72');
}

/* ---------------------------------------------------------------
   14. RENDER
   --------------------------------------------------------------- */
function render() {
  uiButtons.length = 0;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0a1420';
  ctx.fillRect(0, 0, CW, CH);

  ctx.save();
  ctx.beginPath();
  ctx.rect(VOX, VOY, VIEWW * VS, VIEWH * VS);
  ctx.clip();
  ctx.translate(VOX, VOY);
  ctx.scale(VS, VS);

  var mostraTunel = TUN && (state === 'tunnel' || state === 'dead');
  var mostraArena = ARENA && (state === 'arena' || state === 'dead');
  if (state !== 'space' && state !== 'mini' && !mostraTunel && !mostraArena) {
    ctx.save();
    ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
    drawWorld();
    ctx.restore();
  }

  if (mostraTunel) tunnelDraw();
  else if (mostraArena) arenaDraw();
  if (state === 'mini' && MINI) miniDraw();
  if (state === 'play' || state === 'winseq') drawHUD();
  if (state === 'accept') drawAccept();
  else if (state === 'route') drawRoutePanel();
  else if (state === 'dead') drawDead();
  else if (state === 'dest') drawDest();
  else if (state === 'q42') drawQ42();
  else if (state === 'space') drawSpace();
  else if (state === 'win' || state === 'win42') drawWin();
  ctx.restore();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.strokeStyle = 'rgba(79,220,255,0.22)';
  ctx.lineWidth = 1;
  ctx.strokeRect(VOX + 0.5, VOY + 0.5, VIEWW * VS - 1, VIEWH * VS - 1);

  drawPad();
}

/* ---------------------------------------------------------------
   15. LOOP
   --------------------------------------------------------------- */
var acc = 0, last = 0;
function frame(ts) {
  if (!last) last = ts;
  var dt = Math.min(64, ts - last);
  last = ts;
  acc += dt;
  var steps = 0;
  while (acc >= 16.6667 && steps < 4) { update(); acc -= 16.6667; steps++; }
  musicTick();
  render();
  requestAnimationFrame(frame);
}

resize();
buildLevel();
resetRun(false);
requestAnimationFrame(frame);
</script>
