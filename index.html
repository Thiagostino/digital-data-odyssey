<script>
/* =====================================================================
   0. TAGUEAMENTO — dataLayer + GA4 (gtag) ou GTM
   Preencha UM dos dois IDs abaixo. Vazio = nada e carregado e o jogo
   segue 100% offline. Os eventos sempre vao para o window.dataLayer,
   entao da para plugar GTM depois sem tocar no codigo do jogo.
   ===================================================================== */
var GA4_ID = 'G-926LQSHS9W';     // GA4 do Digital Data Odyssey
var GTM_ID = '';                 // ex.: 'GTM-XXXXXXX'  (alternativa ao GA4 direto)
var GAME_VERSION = 'v27';

window.dataLayer = window.dataLayer || [];
function gtag() { window.dataLayer.push(arguments); }

(function carregaTagueamento() {
  var d = document, s0 = d.getElementsByTagName('script')[0], sc;
  if (GTM_ID) {
    window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
    sc = d.createElement('script'); sc.async = true;
    sc.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
    s0.parentNode.insertBefore(sc, s0);
  } else if (GA4_ID) {
    sc = d.createElement('script'); sc.async = true;
    sc.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4_ID;
    s0.parentNode.insertBefore(sc, s0);
    gtag('js', new Date());
    gtag('config', GA4_ID, { send_page_view: true });
  }
})();

var DDO_DEBUG = /[?&]debug=1/.test(location.search);
var SESSION_ID = 's' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
var RUN_ID = SESSION_ID + '-1', RUN_N = 1, RUN_T0 = Date.now();
var TRACK_LOG = [];              // espelho local: util para QA e para o modo debug

/* nomes em snake_case, <=40 caracteres; valores curtos (limites do GA4) */
function track(evento, params) {
  var p = {}, k;
  if (params) for (k in params) if (params.hasOwnProperty(k)) p[k] = params[k];
  p.game_version = GAME_VERSION;
  p.run_id = RUN_ID;
  p.session_seconds = Math.round((Date.now() - RUN_T0) / 1000);
  var push = { event: evento };
  for (k in p) if (p.hasOwnProperty(k)) push[k] = p[k];
  window.dataLayer.push(push);                       // padrao GTM
  if (GA4_ID && typeof window.gtag === 'function') window.gtag('event', evento, p);
  TRACK_LOG.push(push);
  if (TRACK_LOG.length > 400) TRACK_LOG.shift();
  if (DDO_DEBUG && window.console) console.log('%c[ddo]', 'color:#4fdcff', evento, p);
}
function novaRun() { RUN_N++; RUN_ID = SESSION_ID + '-' + RUN_N; RUN_T0 = Date.now(); }

"use strict";
/* =====================================================================
   DIGITAL DATA ODYSSEY: DO MAPEAMENTO AO DATA MAESTRO, REAL-TIME & IA
   Plataforma 2D · Canvas HTML5 + JS puro · arquivo unico · sem dependencias
   ===================================================================== */

/* ---------------------------------------------------------------
   1. CANVAS, VIEWPORT E ESCALA
   --------------------------------------------------------------- */
var cv  = document.getElementById('game');
var ctx = cv.getContext('2d', { alpha: false });

var CW = 0, CH = 0, DPR = 1;
var VIEWW = 480, VIEWH = 270;
var VS = 1, VOX = 0, VOY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = Math.max(1, window.innerWidth);
  CH = Math.max(1, window.innerHeight);
  cv.width  = Math.floor(CW * DPR);
  cv.height = Math.floor(CH * DPR);
  cv.style.width  = CW + 'px';
  cv.style.height = CH + 'px';

  // escala alvo a partir da proporcao da tela
  var alvoW = Math.round(270 * (CW / CH));
  if (alvoW < 260) alvoW = 260;
  if (alvoW > 760) alvoW = 760;
  var vs = Math.min(CW / alvoW, CH / 250);

  // TRAVA DE PIXEL: cada pixel do jogo vira um numero INTEIRO de pixels do
  // dispositivo. Sem isso as bordas caem em fracoes de pixel e o sprite sai
  // borrado, com colunas de pixel de larguras diferentes.
  var passo = Math.max(1, Math.round(vs * DPR));
  // se a area jogavel ficar estreita demais, afasta um passo (nunca estoura a tela)
  while (passo > 1 && (Math.floor(CW / (passo / DPR)) < 240 || Math.floor(CH / (passo / DPR)) < 230)) passo--;
  VS = passo / DPR;

  VIEWW = Math.min(800, Math.floor(CW / VS));
  VIEWH = Math.min(400, Math.floor(CH / VS));

  // deslocamento tambem alinhado ao pixel do dispositivo
  VOX = Math.round((CW - VIEWW * VS) / 2 * DPR) / DPR;
  VOY = Math.round((CH - VIEWH * VS) * (CH > CW * 1.15 ? 0.26 : 0.5) * DPR) / DPR;
  if (VOX < 0) VOX = 0;
  if (VOY < 0) VOY = 0;

  ctx.imageSmoothingEnabled = false;
  ctx.mozImageSmoothingEnabled = false;
  ctx.webkitImageSmoothingEnabled = false;
}
window.addEventListener('resize', resize, false);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); }, false);

/* ---------------------------------------------------------------
   2. AUDIO PROCEDURAL (Web Audio API)
   --------------------------------------------------------------- */
var AU = { ctx: null, master: null, muted: false, ready: false };

function audioInit() {
  if (AU.ctx) return AU.ctx;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  AU.ctx = new AC();
  AU.master = AU.ctx.createGain();
  AU.master.gain.value = 0.30;
  AU.master.connect(AU.ctx.destination);
  AU.ready = true;
  return AU.ctx;
}
function audioResume() {
  var c = audioInit();
  if (c && c.state === 'suspended') c.resume();
}
function tone(freq, when, dur, type, vol, slideTo) {
  if (!AU.ready || AU.muted) return;
  var c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(Math.max(20, freq), when);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), when + dur);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.12), when + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(AU.master);
  o.start(when); o.stop(when + dur + 0.02);
}
function noiseBurst(dur, vol, lowpass) {
  if (!AU.ready || AU.muted) return;
  var c = AU.ctx, n = Math.floor(c.sampleRate * dur);
  var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass || 1400;
  var g = c.createGain(); g.gain.value = vol || 0.2;
  src.connect(f); f.connect(g); g.connect(AU.master);
  src.start();
}
var SFX = {
  jump:      function () { if (!AU.ready) return; var t = AU.ctx.currentTime; tone(330, t, 0.11, 'square', 0.14, 700); },
  land:      function () { noiseBurst(0.06, 0.10, 900); },
  collect:   function () { if (!AU.ready) return; var t = AU.ctx.currentTime; tone(880, t, 0.06, 'square', 0.12); tone(1320, t + 0.06, 0.10, 'square', 0.12); },
  pick:      function () { if (!AU.ready) return; var t = AU.ctx.currentTime; tone(520, t, 0.07, 'triangle', 0.13, 780); },
  ok:        function () { if (!AU.ready) return; var t = AU.ctx.currentTime; [659, 784, 1047, 1319].forEach(function (f, i) { tone(f, t + i * 0.06, 0.12, 'square', 0.13); }); },
  nope:      function () { if (!AU.ready) return; var t = AU.ctx.currentTime; tone(240, t, 0.10, 'square', 0.13, 150); tone(160, t + 0.10, 0.16, 'square', 0.12, 110); },
  stomp:     function () { if (!AU.ready) return; var t = AU.ctx.currentTime; tone(200, t, 0.09, 'square', 0.14, 90); noiseBurst(0.08, 0.14, 1200); },
  lever:     function () { if (!AU.ready) return; var t = AU.ctx.currentTime; tone(140, t, 0.22, 'sawtooth', 0.14, 620); tone(280, t + 0.10, 0.20, 'square', 0.09, 1100); },
  press:     function () { noiseBurst(0.20, 0.26, 620); if (!AU.ready) return; var t = AU.ctx.currentTime; tone(90, t, 0.16, 'square', 0.16, 45); },
  fogos:     function () {
    if (!AU.ready) return; var t = AU.ctx.currentTime;
    for (var i = 0; i < 3; i++) {
      noiseBurst(0.22, 0.09, 2600 - i * 500);
      tone(900 + i * 180, t + i * 0.22, 0.05, 'square', 0.08, 1800);
    }
  },
  pipe:      function (sobe) {
    if (!AU.ready) return; var t = AU.ctx.currentTime;
    tone(sobe ? 240 : 760, t, 0.30, 'square', 0.16, sobe ? 900 : 150);
    tone(sobe ? 120 : 380, t, 0.32, 'triangle', 0.10, sobe ? 450 : 90);
    noiseBurst(0.18, 0.06, 500);
  },
  turbo:     function () { if (!AU.ready) return; var t = AU.ctx.currentTime; tone(220, t, 0.35, 'sawtooth', 0.12, 1400); },
  checkpoint:function () { if (!AU.ready) return; var t = AU.ctx.currentTime; [523, 659, 784, 1047].forEach(function (f, i) { tone(f, t + i * 0.07, 0.12, 'square', 0.12); }); },
  error:     function () { if (!AU.ready) return; var t = AU.ctx.currentTime; tone(300, t, 0.15, 'square', 0.16, 120); tone(150, t + 0.14, 0.35, 'sawtooth', 0.14, 60); noiseBurst(0.3, 0.14, 700); },
  route:     function () { if (!AU.ready) return; var t = AU.ctx.currentTime; [392, 523, 659].forEach(function (f, i) { tone(f, t + i * 0.05, 0.14, 'triangle', 0.12); }); },
  boost:     function () { if (!AU.ready) return; var t = AU.ctx.currentTime; for (var i = 0; i < 10; i++) tone(200 + i * 130, t + i * 0.04, 0.14, 'square', 0.10); },
  warp:      function () { if (!AU.ready) return; var t = AU.ctx.currentTime; tone(120, t, 1.4, 'sawtooth', 0.16, 2400); tone(60, t, 1.6, 'square', 0.10, 900); noiseBurst(1.2, 0.10, 3000); },
  victory:   function () {
    if (!AU.ready) return; var t = AU.ctx.currentTime + 0.05;
    var mel = [523, 659, 784, 1047, 784, 1047, 1319, 1047, 1319, 1568];
    var dur = [0.12, 0.12, 0.12, 0.24, 0.12, 0.12, 0.24, 0.12, 0.12, 0.5], acc = 0;
    for (var i = 0; i < mel.length; i++) { tone(mel[i], t + acc, dur[i] * 0.95, 'square', 0.15); tone(mel[i] / 2, t + acc, dur[i] * 0.95, 'triangle', 0.09); acc += dur[i]; }
  }
};
var MUS = { next: 0, step: 0, on: false };
function musicTick() {
  if (!AU.ready || AU.muted || !MUS.on) return;
  var c = AU.ctx, now = c.currentTime;
  var bpm = (game.route === 'realtime') ? 168 : 138;
  var spb = 60 / bpm / 2;
  if (MUS.next < now) MUS.next = now + 0.05;
  while (MUS.next < now + 0.20) {
    var st = MUS.step % 16;
    var bassPat = [0, 0, 7, 0, 5, 5, 0, 0, 3, 3, 10, 3, 5, 7, 5, 3];
    var root = 98 * (game.zone >= 2 ? 0.94 : 1);
    tone(root * Math.pow(2, bassPat[st] / 12), MUS.next, spb * 0.8, 'square', 0.055);
    if (st % 2 === 0) noiseBurst(0.03, 0.035, 4000);
    if (st % 4 === 0) {
      var leadPat = [12, 15, 19, 17];
      tone(root * 4 * Math.pow(2, leadPat[(MUS.step / 4 | 0) % 4] / 12), MUS.next, spb * 1.4, 'triangle', 0.040);
    }
    MUS.next += spb; MUS.step++;
  }
}

/* ---------------------------------------------------------------
   3. INPUT
   --------------------------------------------------------------- */
var IN = { left: false, right: false, jump: false, down: false };
var KEY = { left: false, right: false, jump: false, down: false };
var PAD = { left: false, right: false, jump: false };
var pointerMap = {};
var uiButtons = [];
var lastJump = false;

function padLayout() {
  var s = Math.max(54, Math.min(104, Math.min(CW, CH) * 0.17));
  var m = Math.max(12, s * 0.24);
  var by = CH - s - m;
  return {
    s: s,
    left:  { x: m,               y: by, w: s,       h: s },
    right: { x: m * 1.5 + s,     y: by, w: s,       h: s },
    jump:  { x: CW - m - s * 1.55, y: by, w: s * 1.55, h: s }
  };
}
function hitRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function padHit(p) {
  var L = padLayout();
  if (hitRect(p, L.jump)) return 'jump';
  if (hitRect(p, L.left)) return 'left';
  if (hitRect(p, L.right)) return 'right';
  return null;
}
function evPos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function uiHit(p) {
  for (var i = uiButtons.length - 1; i >= 0; i--) if (hitRect(p, uiButtons[i])) return uiButtons[i].id;
  return null;
}
function flyMode() {
  return state === 'space' || (state === 'mini' && MINI && MINI.kind === 'comet');
}
function padActive() {
  if (flyMode()) return false;                 // nave e pilotada por arrasto
  return state === 'play' || state === 'winseq' || state === 'mini' || state === 'tunnel' || state === 'arena';
}
var FLY = { drag: false, tx: 0, ty: 0 };
function flySetTarget(p) {
  FLY.drag = true;
  FLY.tx = (p.x - VOX) / VS;
  FLY.ty = (p.y - VOY) / VS;
}
function onDown(e) {
  e.preventDefault(); audioResume();
  var p = evPos(e), b = uiHit(p);
  if (b) { doAction(b); return; }
  if (flyMode()) { pointerMap[e.pointerId] = 'fly'; flySetTarget(p); return; }
  if (padActive()) {
    var k = padHit(p);
    if (k) { pointerMap[e.pointerId] = k; PAD[k] = true; return; }
  }
}
function onMove(e) {
  if (!(e.pointerId in pointerMap)) return;
  e.preventDefault();
  if (pointerMap[e.pointerId] === 'fly') { flySetTarget(evPos(e)); return; }
  var k = padHit(evPos(e)), old = pointerMap[e.pointerId];
  if (k !== old) {
    if (old) PAD[old] = false;
    if (k) { pointerMap[e.pointerId] = k; PAD[k] = true; }
    else delete pointerMap[e.pointerId];
  }
}
function onUp(e) {
  var k = pointerMap[e.pointerId];
  if (k === 'fly') { FLY.drag = false; delete pointerMap[e.pointerId]; return; }
  if (k) { PAD[k] = false; delete pointerMap[e.pointerId]; }
}
cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp, { passive: false });
window.addEventListener('pointercancel', onUp, { passive: false });
['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'dblclick', 'contextmenu']
  .forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false }); });

window.addEventListener('keydown', function (e) {
  audioResume();
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') KEY.left = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') KEY.right = true;
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { KEY.down = true; e.preventDefault(); }
  else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') { KEY.jump = true; e.preventDefault(); }
  else if (k === 'm' || k === 'M') doAction('mute');
  else if (k === 'Enter') {
    if (state === 'accept') { if (!game.accepted) doAction('accept-check'); else doAction('accept-go'); }
    else if (state === 'dead') doAction('restart');
    else if (state !== 'mini' && state !== 'tunnel' && state !== 'arena' && state !== 'play') doAction('again');
  }
  else if (state === 'route') { if (k === '1') doAction('r-realtime'); if (k === '2') doAction('r-batch'); }
  else if (state === 'dest') { var n = parseInt(k, 10); if (n >= 1 && n <= 6) doAction(DESTS[n - 1][0]); }
  else if (state === 'q42') { if (k === '1' || k === 's' || k === 'S') doAction('q42-sim'); if (k === '2' || k === 'n' || k === 'N') doAction('q42-nao'); }
}, false);
window.addEventListener('keyup', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') KEY.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') KEY.right = false;
  else if (k === 'ArrowDown' || k === 's' || k === 'S') KEY.down = false;
  else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') KEY.jump = false;
}, false);

/* ---------------------------------------------------------------
   4. ESTADO GLOBAL
   --------------------------------------------------------------- */
// accept | intro | play | route | mini | dead | winseq | dest | q42 | space | win | win42
var state = 'accept';
var game = {
  score: 0, mult: 1, route: null, aiBoost: false,
  deaths: 0, tagsGot: 0, tagsTotal: 0, zone: 0, t: 0, winT: 0,
  schema: 0, schemaTotal: 0, dest: null, deadMsg: 0, spaceT: 0, accepted: false, acceptWarn: 0, tunStars: {}
};
var cam = { x: 0, y: 0 };
var toasts = [];
var parts = [];
var stars = [];

var DEAD_MSGS = [
  'Ou voce quebrou o seu tagueamento,',
  'ou voce quebrou o seu pipeline,',
  'ou o seu modelo de algoritmo nao foi',
  'bom o suficiente para gerar resultados'
];
var DESTS = [
  ['d-crm',   'CRM COGNITIVO',            '#ff5f8f', ['Parabens! Agora os clientes receberao', 'ofertas hipersegmentadas e contextualizadas!']],
  ['d-gads',  'GOOGLE ADS',               '#f7a83c', ['Parabens! Voce ajudou a atrair mais', 'clientes legais para a empresa!']],
  ['d-meta',  'META ADS',                 '#39d3ff', ['Parabens! Voce ajudou a atrair mais', 'clientes legais para a empresa!']],
  ['d-ctx',   'CONTEXTO ATIVO',           '#ffe14d', ['Parabens! Agora cada interacao usa apenas o sinal', 'mais relevante para o momento do cliente!']],
  ['d-dash',  'DASHBOARDS E ANALISES',    '#7ef29d', ['Parabens! Voce agora ajudou toda a companhia', 'a acompanhar os dados comportamentais dos clientes!']],
  ['d-nproj', 'N PROJETOS E PLATAFORMAS', '#c084fc', ['Parabens! Voce destravou infinitos', 'projetos de dados na sua empresa!']]
];

function toast(txt, col) { toasts.push({ s: txt, c: col || '#ffe14d', t: 0, life: 150 }); }
function burst(x, y, n, col, spd) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, v = (spd || 2) * (0.3 + Math.random());
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.6, life: 26 + Math.random() * 26, t: 0, c: col || '#ffe14d', g: 0.08 });
  }
}

/* ---------------------------------------------------------------
   5. NIVEL
   --------------------------------------------------------------- */
var GY = 200;
var LEVEL_W = 11900;
var ZB = [0, 2600, 5200, 8545, 11900];
var ZONE_NAMES = [
  'ZONA 1: ESCRITORIO & MAPEAMENTO DE TAGS',
  'ZONA 2: SDK NORTHSTAR & DEPLOY',
  'ZONA 3: FABRICA DE DADOS & DATA MAESTRO',
  'ZONA 4: PANTEAO DA INTELIGENCIA & IA COMPORTAMENTAL'
];
var ZONE_SHORT = ['Z1 · ESCRITORIO & TAGS', 'Z2 · SDK NORTHSTAR', 'Z3 · DATA MAESTRO', 'Z4 · PANTEAO & IA'];

var solids = [], movers = [], presses = [], bugs = [], tags = [], cps = [],
    decor = [], npcs = [], gates = [], levers = [], fields = [], bins = [],
    maestro = null, brain = null, carry = null, pipeRef = null, fboss = null,
    exitPipe = null, PIPE = null;

/* camadas de desperdicio do miniboss de FinOps (batch e streaming) */
var FINOPS_BATCH  = ['FULL TABLE SCAN', 'EGRESS DE DADOS', 'CLUSTER OCIOSO'];
var FINOPS_STREAM = ['THROUGHPUT OCIOSO', 'RETENCAO INFINITA', 'EGRESS ENTRE ZONAS'];

function solid(x, y, w, h, kind) { solids.push({ x: x, y: y, w: w, h: h, kind: kind || 'block' }); }
function grd(x, w, y) { solid(x, (y === undefined ? GY : y), w, 260, 'ground'); }

function doAction(id) {
  audioResume();
  if (id === 'mute') {
    AU.muted = !AU.muted;
    if (AU.master) AU.master.gain.value = AU.muted ? 0 : 0.30;
    return;
  }
  if (state === 'accept') {
    if (id === 'accept-check') { game.accepted = !game.accepted; SFX.pick(); return; }
    if (id === 'accept-go') {
      if (game.accepted) {
        resetRun(true); state = 'play'; MUS.on = true; MUS.next = 0; SFX.ok();
        track('game_start', { aceite: 'sim' });
      }
      else { SFX.nope(); game.acceptWarn = game.t + 50; }
      return;
    }
  }
  if (id === 'restart' && state === 'dead') {
    track('checkpoint_restart', { origem: game.deadIn || 'world', zone: game.zone + 1 });
    if (game.deadIn === 'arena') { game.deadIn = null; arenaStart(game.arenaFrom || 'batch'); return; }
    if (game.deadIn === 'tunnel') { game.deadIn = null; tunnelStart(); return; }
    resetRun(false); state = 'play'; MUS.on = true; return;
  }
  if (id === 'again' && (state === 'win' || state === 'win42' || state === 'space' || state === 'dest')) {
    track('game_restart', { origem: state });
    novaRun();
    resetRun(true); state = 'play'; MUS.on = true; MUS.next = 0;
    track('game_start', { aceite: 'sim' });
    return;
  }

  if (state === 'route' && id.indexOf('r-') === 0) {
    game.route = id.slice(2);
    maestro.used = true;
    SFX.route();
    if (game.route === 'realtime') {
      toast('REAL-TIME · ENTRE NO CANO TURBO ▼', '#ffe14d');
      SFX.turbo();
    } else {
      toast('DATA MESH · GLUE → STEP FUNCTIONS → S3 → ATHENA', '#7ef29d');
    }
    burst(maestro.x + 20, maestro.y + 20, 40, '#39d3ff', 3);
    track('route_selected', { rota: game.route, tags_ate_aqui: game.tagsGot });
    state = 'play';
    return;
  }
  if (state === 'dest' && id.indexOf('d-') === 0) {
    for (var i = 0; i < DESTS.length; i++) {
      if (DESTS[i][0] === id) {
        game.dest = i;
        track('destination_selected', { destino: DESTS[i][1], destino_id: id });
        game.score += 3000;
        burst(brain.x + 38, brain.y + 30, 50, DESTS[i][2], 3.4);
        miniStart(MINI_KIND[id]);          // cada destino tem a sua minifase
        return;
      }
    }
  }
  if (state === 'mini' && id === 'mini-skip') { track('minigame_skip', { minigame: MINI.kind }); miniWin(); return; }
  if (state === 'tunnel' && id === 'tun-skip') { track('tunnel_skip', {}); TUN.ok = 1; TUN.okT = 0; SFX.victory(); return; }
  if (state === 'arena' && id === 'arena-skip') { track('finops_boss_skip', {}); ARENA.boss.hp = 1; arenaBossHit(); return; }
  if (state === 'q42') {
    if (id === 'q42-sim') {
      track('q42_answer', { resposta: 'sim' });
      state = 'space'; game.spaceT = 0; game.score += 4200;
      game.shipX = undefined; FLY.drag = false;
      stars.length = 0;
      for (var s = 0; s < 220; s++) stars.push({ x: Math.random() * 800, y: Math.random() * 420, z: 0.3 + Math.random() * 2.4, c: Math.random() < 0.12 ? '#9fe0ff' : '#ffffff' });
      SFX.warp();
      return;
    }
    if (id === 'q42-nao') {
      track('q42_answer', { resposta: 'nao' });
      novaRun();
      toast('RESPOSTA NEGADA · REINICIANDO O PIPELINE', '#ff9db0');
      resetRun(true); state = 'play'; MUS.on = true; SFX.error();
      return;
    }
  }
}

var jumpEdge = false;
function readInput() {
  IN.left = KEY.left || PAD.left;
  IN.right = KEY.right || PAD.right;
  IN.jump = KEY.jump || PAD.jump;
  IN.down = KEY.down;
  jumpEdge = IN.jump && !lastJump;
  lastJump = IN.jump;
}
function ov(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function nearSolids() {
  var list = [], i, s;
  var x0 = cam.x - 140, x1 = cam.x + VIEWW + 140;
  for (i = 0; i < solids.length; i++) { s = solids[i]; if (s.x + s.w > x0 && s.x < x1) list.push(s); }
  for (i = 0; i < movers.length; i++) { s = movers[i]; if (s.x + s.w > x0 && s.x < x1) list.push(s); }
  for (i = 0; i < gates.length; i++) { s = gates[i]; if (!s.open && s.x + s.w > x0 && s.x < x1) list.push(s); }
  return list;
}

function die(forcado) {
  // queda no abismo mata mesmo durante a invulnerabilidade do respawn:
  // sem isso a personagem despencava fora da tela por quase 1s sem game over
  if ((P.inv > 0 && !forcado) || state !== 'play') return;
  SFX.error();
  game.deaths++;
  game.deadIn = 'world';
  track('player_death', { onde: 'mundo', zone: game.zone + 1, pos_x: Math.round(P.x), mortes: game.deaths });
  burst(P.x + P.w / 2, P.y + P.h / 2, 26, '#ff4d6d', 3);
  if (carry) { carry.held = false; carry.x = carry.hx; carry.y = carry.hy; carry = null; }
  state = 'dead';
  MUS.on = false;
}

function update() {
  game.t++;
  for (var ti = toasts.length - 1; ti >= 0; ti--) { toasts[ti].t++; if (toasts[ti].t > toasts[ti].life) toasts.splice(ti, 1); }
  for (var pi = parts.length - 1; pi >= 0; pi--) {
    var pa = parts[pi]; pa.t++; pa.x += pa.vx; pa.y += pa.vy; pa.vy += pa.g; pa.vx *= 0.99;
    if (pa.t > pa.life) parts.splice(pi, 1);
  }
  if (state === 'tunnel') { tunnelUpdate(); return; }
  if (state === 'arena') { arenaUpdate(); return; }
  if (state === 'pipe') { pipeUpdate(); return; }
  if (state === 'mini') { miniUpdate(); return; }
  for (var mi = 0; mi < movers.length; mi++) updateMover(movers[mi]);
  for (var qi = 0; qi < presses.length; qi++) updatePress(presses[qi]);
  for (var bi = 0; bi < bugs.length; bi++) updateBug(bugs[bi]);
  for (var gi = 0; gi < gates.length; gi++) {
    var gg = gates[gi];
    // o gate de qualidade libera sozinho assim que o tagueamento esta completo
    if (gg.kind === 'quality' && !gg.open && game.schema >= game.schemaTotal) {
      gg.open = true; SFX.ok();
      track('quality_gate_pass', { schema: game.schemaTotal });
      toast('GATE DE QUALIDADE: TAGUEAMENTO APROVADO', '#7ef29d');
      game.score += 800 * game.mult;
      burst(gg.x + 9, gg.y + 40, 22, '#7ef29d', 2.4);
    }
    if (gg.kind === 'quality' && !gg.open && state === 'play' &&
        Math.abs((P.x + P.w / 2) - (gg.x + gg.w / 2)) < 40) {
      if (!gg.warn || game.t - gg.warn > 260) {
        gg.warn = game.t;
        track('quality_gate_block', { faltam: game.schemaTotal - game.schema });
        toast('GATE BLOQUEADO · FALTAM ' + (game.schemaTotal - game.schema) + ' CAMPOS DO DATALAYER (ZONA 1)', '#ff9db0');
        SFX.nope();
      }
    }
    if (gg.open && gg.t < 100) gg.t++;
  }
  for (var fi = 0; fi < bins.length; fi++) if (bins[fi].flash > 0) bins[fi].flash--;
  if (maestro) maestro.t++;
  if (brain) brain.t++;
  if (state === 'space') {
    readInput(); game.spaceT++;
    if (game.spaceT === 1) fimDeJogo('nave_42');
    return;
  }
  if (state === 'winseq') { winSequence(); updateCam(); return; }
  if (state !== 'play') { updateCam(); return; }

  readInput();
  if (jumpEdge) P.buf = 8;
  if (P.buf > 0) P.buf--;
  if (P.inv > 0) P.inv--;

  if (P.riding) { P.x += P.riding.dx; P.y += P.riding.dy; }

  var ms = baseSpeed();
  if (IN.left) { P.vx -= ACC; P.face = -1; }
  if (IN.right) { P.vx += ACC; P.face = 1; }
  if (!IN.left && !IN.right) P.vx *= FRIC;
  if (P.vx > ms) P.vx = ms;
  if (P.vx < -ms) P.vx = -ms;
  if (Math.abs(P.vx) < 0.04) P.vx = 0;

  if (P.onGround) P.coyote = 7; else if (P.coyote > 0) P.coyote--;
  if (P.buf > 0 && P.coyote > 0) {
    P.vy = JUMPV; P.buf = 0; P.coyote = 0; P.onGround = false;
    SFX.jump(); burst(P.x + P.w / 2, P.y + P.h, 5, '#9fd8ff', 1.2);
  }
  if (!IN.jump && P.vy < -2.6) P.vy = -2.6;

  P.vy += GRAV;
  if (P.vy > MAXFALL) P.vy = MAXFALL;

  var list = nearSolids();
  var wasAir = !P.onGround;
  P.riding = null; P.ground = null;
  var i, s;
  P.x += P.vx;
  for (i = 0; i < list.length; i++) {
    s = list[i];
    if (!ov(P, s)) continue;
    if (P.vx > 0) P.x = s.x - P.w; else if (P.vx < 0) P.x = s.x + s.w;
    P.vx = 0;
  }
  var pesAntes = P.y + P.h;
  P.y += P.vy;
  P.onGround = false;
  for (i = 0; i < list.length; i++) {
    s = list[i];
    if (!ov(P, s)) continue;
    if (P.vy > 0) {
      // so aterrissa se os pes estavam acima do topo no quadro anterior
      if (pesAntes > s.y + Math.max(4, P.vy + 3)) continue;
      P.y = s.y - P.h; P.vy = 0; P.onGround = true; P.ground = s; if (s.mover) P.riding = s;
    } else if (P.vy < 0) { P.y = s.y + s.h; P.vy = 0.6; }
  }
  if (P.onGround && wasAir) { SFX.land(); burst(P.x + P.w / 2, P.y + P.h, 4, '#8899aa', 1); }
  if (P.x < 0) { P.x = 0; P.vx = 0; }
  if (P.x + P.w > LEVEL_W) { P.x = LEVEL_W - P.w; P.vx = 0; }
  P.anim += Math.abs(P.vx);

  if (P.y > 292) { die(true); return; }

  var z = 0;
  for (i = 0; i < 4; i++) if (P.x >= ZB[i]) z = i;
  if (z !== game.zone) {
    game.zone = z; toast(ZONE_NAMES[z], '#39d3ff'); SFX.checkpoint();
    track('zone_enter', { zone: z + 1, zone_nome: ZONE_SHORT[z], score: game.score });
    if (z === 3 && game.route === 'realtime') toast('THROTTLE DE PRECISAO NO PANTEAO', '#ffb020');
  }

  // ---- campo do dataLayer carregado acompanha o jogador
  if (carry) { carry.x = P.x - 2; carry.y = P.y - 26; }

  // ---- coleta de campos do dataLayer
  if (!carry) {
    for (i = 0; i < fields.length; i++) {
      var f = fields[i];
      if (f.done || f.held) continue;
      if (ov(P, f)) {
        f.held = true; carry = f; SFX.pick();
        toast('CAMPO EM MAOS: ' + f.key + ' → CAIXA ' + f.cat, '#39d3ff');
        break;
      }
    }
  } else {
    for (i = 0; i < bins.length; i++) {
      var bn = bins[i];
      if (!ov(P, bn)) continue;
      // e preciso PARAR na caixa para soltar o campo (evita entrega acidental ao correr)
      if (Math.abs(P.vx) > 0.8) continue;
      if (bn.cat === carry.cat) {
        carry.done = true; carry.held = false; bn.count++; bn.flash = 30;
        game.schema++;
        game.score += 250 * game.mult;
        SFX.ok(); burst(bn.x + 17, bn.y, 16, bn.col, 2.2);
        toast('SCHEMA OK: ' + carry.key + ' → ' + bn.cat + '  (' + game.schema + '/' + game.schemaTotal + ')', '#7ef29d');
        track('field_delivered', { campo: carry.key, caixa: bn.cat, schema: game.schema + '/' + game.schemaTotal });
        carry = null;
        if (game.schema >= game.schemaTotal) {
          toast('SCHEMA VALIDADO · DATALAYER PUBLICADO', '#ffe14d');
          track('schema_complete', { campos: game.schemaTotal });
          game.score += 1000 * game.mult;
        }
      } else {
        track('field_wrong_box', { campo: carry.key, caixa: bn.cat, esperado: carry.cat });
        carry.held = false; carry.x = carry.hx; carry.y = carry.hy;
        game.score = Math.max(0, game.score - 50);
        SFX.nope(); bn.flash = 20;
        toast('CAIXA ERRADA: ' + carry.key + ' NAO E ' + bn.cat, '#ff9db0');
        carry = null;
      }
      break;
    }
  }

  // ---- eventos coletaveis
  for (i = 0; i < tags.length; i++) {
    var tg = tags[i]; tg.t++;
    if (tg.got) continue;
    if (ov(P, tg)) {
      tg.got = true; game.tagsGot++;
      track('tag_collected', { tag: tg.label, zone: game.zone + 1, total: game.tagsGot + '/' + game.tagsTotal });
      game.score += 100 * game.mult;
      SFX.collect(); burst(tg.x + 7, tg.y + 7, 12, '#ffe14d', 2);
    }
  }
  // ---- checkpoints
  for (i = 0; i < cps.length; i++) {
    var c = cps[i];
    if (!c.on && P.x + P.w > c.x - 6 && P.x < c.x + c.w + 6 && Math.abs((P.y + P.h) - (c.y + c.h)) < 46) {
      c.on = true; c.fw = 0; P.spawnX = c.x - 4; P.spawnY = c.y - 2;
      track('checkpoint_reached', { zone: game.zone + 1, pos_x: Math.round(c.x), score: game.score });
      SFX.checkpoint(); SFX.fogos(); toast('CHECKPOINT', '#ffe14d');
      burst(c.x + 7, c.y, 20, '#ffe14d', 2.4);
      burst(c.x + 7, c.y - 20, 16, '#ff5f8f', 2.8);
      game.score += 50 * game.mult;
    }
  }
  // ---- bugs
  for (i = 0; i < bugs.length; i++) {
    var b = bugs[i];
    if (b.dead) continue;
    if (ov(P, b)) {
      if (P.vy > 0.8 && (P.y + P.h) - b.y < 11) {
        b.dead = 1; P.vy = -5.0; SFX.stomp();
        game.score += 75 * game.mult;
        burst(b.x + 6, b.y + 4, 12, '#ff4d6d', 2);
      } else { die(); return; }
    }
  }
  // ---- miniboss de FinOps (fim da trilha AWS)
  // ---- prensas
  for (i = 0; i < presses.length; i++) {
    var pr = presses[i];
    if (ov(P, { x: pr.x + 2, y: pr.y, w: pr.w - 4, h: pr.h })) { die(); return; }
  }
  // ---- alavanca de deploy
  for (i = 0; i < levers.length; i++) {
    var lv = levers[i];
    if (!lv.on && ov(P, lv)) {
      lv.on = true; SFX.lever();
      for (var g2 = 0; g2 < gates.length; g2++) if (gates[g2].kind === 'deploy') gates[g2].open = true;
      track('deploy_prod', { zone: game.zone + 1 });
      toast('BUILD AUTORIZADO · DEPLOY EM PRODUCAO OK', '#7ef29d');
      game.score += 300 * game.mult;
      burst(lv.x + 10, lv.y + 6, 22, '#7ef29d', 2.4);
    }
  }
  // cano turbo: pise em cima dele com a rota Real-Time escolhida
  if (pipeRef && !pipeRef.used) {
    var emCima = P.ground === pipeRef ||
      (P.x + P.w > pipeRef.x + 2 && P.x < pipeRef.x + pipeRef.w - 2 &&
       Math.abs((P.y + P.h) - pipeRef.y) < 6);
    if (game.route === 'realtime' && emCima) {
      pipeRef.used = true;
      track('pipe_enter', { rota: 'realtime' });
      pipeStart('in', pipeRef, 'tunnel');       // desce pelo cano, estilo Mario
      return;
    }
  }
  // ---- porta da arena do miniboss de FinOps (fim da trilha AWS)
  if (fboss && !fboss.done && P.x + P.w > fboss.x && P.x < fboss.x + fboss.w) {
    P.spawnX = fboss.x - 60; P.spawnY = GY - 40;
    arenaStart('batch'); return;
  }
  if (maestro && !maestro.used && ov(P, maestro)) { state = 'route'; SFX.route(); return; }
  if (brain && state === 'play' && ov(P, brain)) {
    state = 'winseq'; game.winT = 0; MUS.on = false; SFX.boost();
    track('ai_boost', { tags: game.tagsGot + '/' + game.tagsTotal, rota: game.route, score: game.score });
    game.aiBoost = true; game.mult = 10;
    return;
  }
  updateCam();
}

function finopsGate(open) {
  for (var i = 0; i < gates.length; i++) if (gates[i].kind === 'finops') {
    if (open && !gates[i].open) { gates[i].open = true; gates[i].t = 0; }
  }
}

function updateMover(m) {
  var px = m.x, py = m.y;
  m.p += m.dir * m.spd;
  var len = Math.abs(m.bx - m.ax) + Math.abs(m.by - m.ay);
  if (m.p > len) { m.p = len; m.dir = -1; }
  if (m.p < 0) { m.p = 0; m.dir = 1; }
  var k = len === 0 ? 0 : m.p / len;
  m.x = m.ax + (m.bx - m.ax) * k;
  m.y = m.ay + (m.by - m.ay) * k;
  m.dx = m.x - px; m.dy = m.y - py;
}
function updatePress(pr) {
  pr.t++;
  var ph = ((pr.t + pr.phase) % pr.period) / pr.period, v;
  if (ph < 0.42) v = Math.pow(ph / 0.42, 2.6);
  else if (ph < 0.55) v = 1;
  else v = 1 - (ph - 0.55) / 0.45;
  var ny = pr.top + pr.range * v;
  if (v === 1 && !pr.slam) {
    pr.slam = true;
    if (Math.abs(pr.x - (cam.x + VIEWW / 2)) < VIEWW * 0.7 && state === 'play') SFX.press();
    burst(pr.x + 15, ny + 26, 6, '#8fb6d8', 1.6);
  }
  if (v < 0.9) pr.slam = false;
  pr.y = ny;
}
function updateBug(b) {
  if (b.dead) { b.dead++; return; }
  b.t++; b.x += b.vx;
  if (b.x < b.min) { b.x = b.min; b.vx = Math.abs(b.vx); }
  if (b.x + b.w > b.max) { b.x = b.max - b.w; b.vx = -Math.abs(b.vx); }
}
function updateCam() {
  var base = GY + 70 - VIEWH;
  var tx = P.x + P.w / 2 - VIEWW * 0.42;
  // ancora vertical: a camera segue o piso onde a engenheira esta, nao o pulo.
  // sem isso o cenario inteiro sobe e desce a cada salto
  if (P.onGround) cam.anchorY = P.y;
  if (cam.anchorY === undefined) cam.anchorY = P.y;
  var segue = P.y;
  if (!P.onGround) {
    var dif = P.y - cam.anchorY;
    if (dif > 46) segue = cam.anchorY + (dif - 46);        // queda longa: acompanha
    else if (dif < -58) segue = cam.anchorY + (dif + 58);  // subida alta: acompanha
    else segue = cam.anchorY;                              // pulo normal: nao mexe
  }
  var ty = segue - VIEWH * 0.58;
  if (tx < 0) tx = 0;
  if (tx > LEVEL_W - VIEWW) tx = LEVEL_W - VIEWW;
  if (ty < base - 70) ty = base - 70;
  if (ty > base + 34) ty = base + 34;
  // zona morta: micro-oscilacoes nao movem o cenario
  if (Math.abs(tx - cam.x) > 1.2) cam.x += (tx - cam.x) * 0.10;
  if (Math.abs(ty - cam.y) > 1.0) cam.y += (ty - cam.y) * 0.042;
}
function winSequence() {
  game.winT++;
  var t = game.winT;
  if (t % 2 === 0) {
    var a = Math.random() * Math.PI * 2;
    parts.push({
      x: brain.x + 38 + Math.cos(a) * 40, y: brain.y + 34 + Math.sin(a) * 34,
      vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 2.4 - 1,
      life: 60, t: 0, c: ['#ffe14d', '#39d3ff', '#7ef29d', '#ff5f8f'][(Math.random() * 4) | 0], g: -0.02
    });
  }
  // particulas de energia subindo pela personagem enquanto recebe o boost
  if (t > 40 && t % 3 === 0) {
    parts.push({
      x: P.x + Math.random() * P.w, y: P.y + P.h,
      vx: (Math.random() - 0.5) * 0.6, vy: -1.6 - Math.random(),
      life: 40, t: 0, c: Math.random() < 0.5 ? '#7ef29d' : '#4fdcff', g: -0.03
    });
  }
  if (t === 12) SFX.turbo();
  if (t === 24) toast('INTELIGENCIA COMPORTAMENTAL ATIVADA', '#7ef29d');
  if (t === 44) { SFX.boost(); burst(P.x + P.w / 2, P.y + P.h / 2, 24, '#7ef29d', 2.4); }
  if (t === 96) toast('AI BOOST · MULTIPLICADOR 10x', '#ffe14d');
  if (t === 60) game.score += 5000;
  if (t === 140) game.score += 100 * game.tagsGot;
  if (t === 150) SFX.victory();
  if (t > 230) state = 'dest';
  P.vy += GRAV; P.y += P.vy;
  var list = nearSolids();
  P.onGround = false;
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    if (!ov(P, s)) continue;
    if (P.vy > 0) { P.y = s.y - P.h; P.vy = 0; P.onGround = true; }
  }
}

/* ---------------------------------------------------------------
   9. HELPERS DE DESENHO
   --------------------------------------------------------------- */
function r(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
function box3(x, y, w, h, base, light, dark) {   // volume em 3 tons
  r(x, y, w, h, base);
  r(x, y, w, 1, light);
  r(x, y, 1, h, light);
  r(x, y + h - 1, w, 1, dark);
  r(x + w - 1, y, 1, h, dark);
}
function txt(s, x, y, size, color, align, shadow) {
  ctx.font = 'bold ' + size + 'px "Courier New",Courier,monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  if (shadow !== false) { ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = color || '#ffffff';
  ctx.fillText(s, x, y);
}
/* valor em reais no formato curto: R$ 900 MIL / R$ 1,2 MI */
function moeda(v) {
  if (v >= 1000000) {
    var mi = (v / 1000000);
    return 'R$ ' + (mi >= 10 ? Math.round(mi) : mi.toFixed(1).replace('.', ',')) + ' MI';
  }
  return 'R$ ' + Math.round(v / 1000) + ' MIL';
}
/* placa escura atras do texto: mantem a leitura nitida sobre qualquer cenario */
function plaqueta(s, cx, y, size, col, borda) {
  var w = tw(s, size) + 12, h = size + 7;
  if (cx - w / 2 < 3) cx = w / 2 + 3;                 // nunca vaza pela borda
  if (cx + w / 2 > VIEWW - 3) cx = VIEWW - 3 - w / 2;
  r(cx - w / 2, y - 3, w, h, 'rgba(6,14,26,0.9)');
  if (borda) { r(cx - w / 2, y - 3, w, 1, borda); r(cx - w / 2, y + h - 4, w, 1, borda); }
  txt(s, cx, y, size, col, 'center', false);
  return w;
}
function tw(s, size) { ctx.font = 'bold ' + size + 'px "Courier New",Courier,monospace'; return ctx.measureText(s).width; }
function balloon(cx, by, lines, size, col) {
  var i, w = 0;
  for (i = 0; i < lines.length; i++) w = Math.max(w, tw(lines[i], size));
  var pw = w + 10, ph = lines.length * (size + 2) + 8;
  var x = Math.round(cx - pw / 2), y = Math.round(by - ph - 6);
  var minX = Math.round(cam.x) + 3, maxX = Math.round(cam.x) + VIEWW - pw - 3;
  if (maxX < minX) maxX = minX;
  if (x < minX) x = minX;
  if (x > maxX) x = maxX;
  var minY = Math.round(cam.y) + 34;
  if (y < minY) y = minY;
  var tx2 = Math.max(x + 6, Math.min(Math.round(cx), x + pw - 6));
  r(x - 1, y - 1, pw + 2, ph + 2, '#12202e');
  r(x, y, pw, ph, col || '#f7fbff');
  r(x + 1, y + 1, pw - 2, 1, '#ffffff');
  r(x + 1, y + ph - 2, pw - 2, 1, '#c8d6e4');
  r(tx2 - 3, y + ph, 6, 2, col || '#f7fbff');
  r(tx2 - 2, y + ph + 2, 4, 2, col || '#f7fbff');
  r(tx2 - 1, y + ph + 4, 2, 2, col || '#f7fbff');
  r(tx2 - 4, y + ph, 1, 2, '#12202e'); r(tx2 + 3, y + ph, 1, 2, '#12202e');
  for (i = 0; i < lines.length; i++) txt(lines[i], x + pw / 2, y + 4 + i * (size + 2), size, '#16233a', 'center', false);
}

/* ---------------------------------------------------------------
   10. FUNDOS POR ZONA  (direcao visual: ceu ciano + silhuetas azuis)
   --------------------------------------------------------------- */
function zoneAt(x) { var z = 0; for (var i = 0; i < 4; i++) if (x >= ZB[i]) z = i; return z; }

function skyGrad(x0, y0, h, c1, c2, c3) {
  var g = ctx.createLinearGradient(0, y0, 0, y0 + h);
  g.addColorStop(0, c1); g.addColorStop(0.58, c2); g.addColorStop(1, c3);
  ctx.fillStyle = g;
  ctx.fillRect(Math.round(x0 - 4), Math.round(y0), VIEWW + 8, Math.round(h));
}
/* cerebro em pixel art — substitui as nuvens no Panteao da Inteligencia */
function pixBrain(x, y, s, alpha) {
  var A = alpha === undefined ? 0.92 : alpha;
  var W = Math.round(38 * s), H = Math.round(24 * s);
  ctx.globalAlpha = A * 0.35;
  r(x - 3 * s, y - 3 * s, W + 6 * s, H + 6 * s, '#7a4fd0');
  ctx.globalAlpha = A;
  // lobos
  r(x, y + 5 * s, W, H - 8 * s, '#e05a8f');
  r(x + 5 * s, y, W - 10 * s, H - 4 * s, '#e05a8f');
  r(x + 12 * s, y - 4 * s, W - 24 * s, 8 * s, '#e05a8f');
  // brilho superior
  r(x + 6 * s, y + s, W - 12 * s, 3 * s, '#ff8fb8');
  // sulcos
  r(x + 4 * s, y + 7 * s, W - 8 * s, 2 * s, '#ffb3cd');
  r(x + 8 * s, y + 12 * s, W - 18 * s, 2 * s, '#ffb3cd');
  r(x + 6 * s, y + 17 * s, W - 14 * s, 2 * s, '#a83a68');
  // tronco cerebral
  r(x + W * 0.4, y + H - 4 * s, 8 * s, 5 * s, '#c04a78');
  // sinapses piscando
  var syn = (game.t / 8 | 0);
  r(x + 6 * s, y + 4 * s, 2 * s, 2 * s, (syn + 1) % 3 ? '#fff0a8' : '#e05a8f');
  r(x + W - 9 * s, y + 9 * s, 2 * s, 2 * s, (syn + 2) % 3 ? '#9fe8ff' : '#e05a8f');
  r(x + W * 0.5, y + 15 * s, 2 * s, 2 * s, syn % 3 ? '#fff0a8' : '#e05a8f');
  ctx.globalAlpha = 1;
}
function pixCloud(x, y, s, alpha) {
  ctx.globalAlpha = alpha === undefined ? 0.92 : alpha;
  r(x, y, 34 * s, 7 * s, '#ffffff');
  r(x + 6 * s, y - 5 * s, 20 * s, 6 * s, '#ffffff');
  r(x + 14 * s, y - 9 * s, 11 * s, 5 * s, '#ffffff');
  r(x + 2 * s, y + 7 * s, 30 * s, 2 * s, '#d9ecfa');
  ctx.globalAlpha = 1;
}
/* suavizacao do parallax: quanto menor PAR_SOFT, mais calmo o fundo */
var PAR_SOFT = 0.58;
function PARX(f) { return f * PAR_SOFT; }
function skyline(x0, w, par, baseY, colA, colB, seedOff, bw) {
  var seeds = [7, 3, 11, 5, 9, 2, 13, 6, 4, 8, 12, 10, 5, 14];
  var off = Math.floor(x0 * par);
  for (var k = -1; k < Math.ceil(w / bw) + 2; k++) {
    var idx = ((k + Math.floor(off / bw) + seedOff) % seeds.length + seeds.length) % seeds.length;
    var hgt = 40 + seeds[idx] * 8;
    var bx = x0 + k * bw - (off % bw);
    r(bx, baseY - hgt, bw - 5, hgt + 60, colA);
    r(bx, baseY - hgt, bw - 5, 2, colB);
    // janelas
    for (var wy = 0; wy < Math.floor(hgt / 11); wy++) {
      for (var wx = 0; wx < Math.max(1, Math.floor((bw - 12) / 9)); wx++) {
        if ((wy * 3 + wx + seeds[idx]) % 5 === 0) continue;
        r(bx + 4 + wx * 9, baseY - hgt + 7 + wy * 11, 4, 5, colB);

    for (var pe = 0; pe < 3; pe++) {

      r(d.x + pw2 + 1 + pe * 4, d.y - 3, 3, 3, pe % 2 ? '#ffc93c' : '#1a1208');
    }
    r(d.x - 14, d.y, 14, 4, '#ffc93c');
    r(d.x + pw2, d.y, 14, 4, '#ffc93c');
    r(d.x - 14, d.y + 4, 14, 2, '#7a5408');
    r(d.x + pw2, d.y + 4, 14, 2, '#7a5408');
    if (pw2 < 400) {
      var bl2 = Math.sin(game.t * 0.1) > 0 ? '#ff4d6d' : '#5c1425';
      r(d.x + pw2 / 2 - 5, d.y - 22, 10, 10, bl2);
      txt('!', d.x + pw2 / 2, d.y - 21, 8, '#1a0208', 'center', false);
    }
  } else if (d.t === 'qgate') {
    drawQualityStation(d.x, d.y);
  }
}

/* Busto de marmore com placa: homenagem a quem pavimentou o caminho ate a IA.
   variant 0=barba, 1=cabelo longo, 2=cabelo curto, 3=coque */
function drawBust(x, y, nome, campo, variant) {
  var M = '#e6e3d8', ML = '#f8f6ef', MS = '#bcb8a9', MD = '#8e8a7c';
  // pedestal
  box3(x, y - 20, 38, 20, '#a8a294', '#d4cfc0', '#6d6a5e');
  box3(x + 3, y - 26, 32, 6, '#bcb8a9', '#e2ddce', '#7d7a6c');
  r(x + 6, y - 15, 26, 2, '#8d8a7c');
  r(x + 6, y - 9, 26, 2, '#8d8a7c');
  // placa flutuante acima da cabeca
  var nw = Math.max(tw(nome, 5), tw(campo, 5)) + 10;
  r(x + 19 - nw / 2, y - 88, nw, 9, 'rgba(14,10,30,0.92)');
  r(x + 19 - nw / 2, y - 88, nw, 1, '#ffd98a');
  txt(nome, x + 19, y - 87, 5, '#ffd98a', 'center', false);
  r(x + 19 - nw / 2, y - 79, nw, 8, 'rgba(14,10,30,0.8)');
  txt(campo, x + 19, y - 78, 5, '#a89ec0', 'center', false);
  // ombros
  box3(x + 6, y - 44, 26, 18, M, ML, MS);
  r(x + 6, y - 44, 26, 2, ML);
  r(x + 12, y - 42, 4, 16, MS);
  r(x + 23, y - 42, 4, 16, MS);
  // cabeca
  r(x + 12, y - 62, 14, 19, M);
  r(x + 12, y - 62, 14, 3, ML);
  r(x + 24, y - 59, 2, 15, MS);
  r(x + 15, y - 54, 2, 2, MD);
  r(x + 21, y - 54, 2, 2, MD);
  r(x + 18, y - 50, 2, 4, MS);
  r(x + 16, y - 47, 6, 1, MD);
  if (variant === 0) {              // barba e cabelo ondulado
    r(x + 11, y - 65, 16, 6, MS);
    r(x + 11, y - 65, 16, 2, M);
    r(x + 13, y - 46, 12, 8, MS);
    r(x + 14, y - 44, 10, 5, M);
    r(x + 10, y - 58, 3, 10, MS);
    r(x + 25, y - 58, 3, 10, MS);
  } else if (variant === 1) {        // cabelo longo preso
    r(x + 11, y - 65, 16, 5, MS);
    r(x + 11, y - 65, 16, 2, M);
    r(x + 9, y - 61, 3, 20, MS);
    r(x + 26, y - 61, 3, 20, MS);
    r(x + 8, y - 44, 4, 6, MD);
    r(x + 26, y - 44, 4, 6, MD);
  } else if (variant === 2) {        // cabelo curto repartido
    r(x + 11, y - 64, 16, 5, MS);
    r(x + 11, y - 64, 9, 2, M);
    r(x + 10, y - 60, 2, 7, MS);
    r(x + 26, y - 60, 2, 7, MS);
  } else {                           // coque
    r(x + 11, y - 64, 16, 5, MS);
    r(x + 11, y - 64, 16, 2, M);
    r(x + 15, y - 70, 8, 6, MS);
    r(x + 16, y - 69, 6, 3, M);
  }
  // brilho de marmore
  ctx.globalAlpha = 0.16;
  r(x + 8, y - 62, 3, 34, '#ffffff');
  ctx.globalAlpha = 1;
}

/* Estacao do GATE DE QUALIDADE: escaneia a jornada antes do deploy e so
   libera a passagem se o tagueamento (schema do dataLayer) estiver completo. */
function drawQualityStation(x, y) {
  var okAll = game.schema >= game.schemaTotal;
  var t = game.t;
  // pilar de scanner
  box3(x, y - 104, 14, 104, '#22354d', '#41618a', '#101a26');
  box3(x + 96, y - 104, 14, 104, '#22354d', '#41618a', '#101a26');
  box3(x, y - 112, 110, 12, '#1a2a3e', '#39567a', '#0b1420');
  for (var i = 0; i < 9; i++) {
    var on = okAll || ((t / 8 | 0) + i) % 3 === 0;
    r(x + 8 + i * 11, y - 108, 6, 4, on ? (okAll ? '#7ef29d' : '#ffb020') : '#22364c');
  }
  // feixe do scanner
  ctx.globalAlpha = 0.12 + 0.08 * Math.sin(t * 0.12);
  r(x + 14, y - 100, 96, 100, okAll ? '#7ef29d' : '#ffb020');
  ctx.globalAlpha = 1;
  var sy = y - 96 + ((t * 1.4) % 92);
  ctx.globalAlpha = 0.5;
  r(x + 14, sy, 96, 2, okAll ? '#7ef29d' : '#ffe14d');
  ctx.globalAlpha = 1;
  // painel com o checklist
  var px = x + 18, py = y - 92;
  box3(px, py, 88, 52, '#0d1a2a', '#2b4a6d', '#050c16');
  txt('GATE DE QUALIDADE', px + 44, py + 4, 7, '#4fdcff', 'center', false);
  r(px + 4, py + 13, 80, 1, '#1f3550');
  var rows = [
    ['SCHEMA', game.schema + '/' + game.schemaTotal, game.schema >= game.schemaTotal],
    ['EVENTOS', String(game.tagsGot), game.tagsGot > 0],
    ['LINHAGEM', okAll ? 'OK' : '--', okAll]
  ];
  for (var k = 0; k < rows.length; k++) {
    txt(rows[k][0], px + 6, py + 17 + k * 9, 6, '#8fa8c4', 'left', false);
    txt(rows[k][1], px + 82, py + 17 + k * 9, 6, rows[k][2] ? '#7ef29d' : '#ff9db0', 'right', false);
  }
  r(px + 4, py + 43, 80, 8, okAll ? '#1e5c3c' : '#5c2030');
  txt(okAll ? 'APROVADO' : 'BLOQUEADO', px + 44, py + 44, 6, okAll ? '#7ef29d' : '#ff9db0', 'center', false);
  // placa no chao
  r(x + 16, y - 14, 78, 12, 'rgba(8,16,28,0.9)');
  txt('GATE DE QUALIDADE', x + 55, y - 13, 6, '#4fdcff', 'center', false);
}

function drawSolid(s) {
  var k = s.kind;
  if (k === 'ground') { drawGround(s); return; }
  if (k === 'desk') {
    box3(s.x, s.y, s.w, 10, '#5f7d9e', '#82a3c4', '#3a5474');
    r(s.x + 3, s.y + 10, 3, 9, '#3a5474');
    r(s.x + s.w - 6, s.y + 10, 3, 9, '#3a5474');
  } else if (k === 'pipe') {
    // torre de dados: rack com unidades, leds e ventilacao
    var th = s.h, tx = s.x, ty = s.y;
    r(tx - 1, ty - 1, s.w + 2, th + 2, '#0d131d');                    // contorno
    box3(tx, ty + 6, s.w, th - 6, '#2b4a6e', '#4f7fb2', '#16283e');   // corpo
    r(tx + 2, ty + 8, 3, th - 11, '#6d9fd0');                         // brilho lateral
    r(tx + s.w - 4, ty + 8, 2, th - 11, '#15263a');
    for (var ru = 0; ru + 14 < th - 6; ru += 14) {                    // unidades do rack
      var uy = ty + 10 + ru;
      r(tx + 4, uy, s.w - 8, 10, '#101d2c');
      r(tx + 4, uy, s.w - 8, 1, '#39587c');
      for (var vt = 0; vt < 4; vt++) r(tx + 6 + vt * 4, uy + 6, 2, 2, '#2b4560');
      var on = ((game.t / 12 | 0) + ru) % 3;
      r(tx + s.w - 9, uy + 2, 3, 3, on === 0 ? '#7ef29d' : '#1c3a28');
      r(tx + s.w - 9, uy + 6, 3, 2, on === 1 ? '#39d3ff' : '#14303e');
    }
    box3(tx - 3, ty, s.w + 6, 8, '#39628e', '#7ba9d8', '#1b3350');     // tampa
    r(tx - 3, ty + 1, s.w + 6, 1, '#a9d4f5');
    r(tx - 1, ty - 3, 4, 3, '#5f8fbf');                                // antena
    r(tx - 1, ty - 6, 2, 3, '#39d3ff');
    r(tx - 4, ty + th - 3, s.w + 8, 3, '#16283e');                     // base
  } else if (k === 'tube') {
    // plataforma tubular com tampas nas pontas
    r(s.x - 1, s.y - 1, s.w + 2, s.h + 2, '#0d131d');
    box3(s.x, s.y, s.w, s.h, '#2a5a86', '#57a3d8', '#12324e');
    r(s.x + 1, s.y + 1, s.w - 2, 2, '#8fd6f5');
    for (var j = 6; j < s.w - 4; j += 12) r(s.x + j, s.y + 4, 3, Math.max(2, s.h - 6), 'rgba(140,225,255,0.24)');
    r(s.x, s.y, 3, s.h, '#1b3f61');
    r(s.x + s.w - 3, s.y, 3, s.h, '#1b3f61');
  } else if (k === 'greenpipe') {
    var noCano = (PIPE && PIPE.cano === s);
    var rt = (game.route === 'realtime' && (!s.used || noCano) && !s.saida);
    // corpo do cano
    box3(s.x + 4, s.y + 10, s.w - 8, s.h - 10, '#2f8f3c', '#63d86a', '#175c22');
    for (var gp = 0; gp < s.h - 14; gp += 6) r(s.x + 8, s.y + 14 + gp, 4, 3, '#8cf09a');
    // boca do cano
    box3(s.x, s.y, s.w, 12, '#37a745', '#7fe88a', '#1c6b28');
    r(s.x + 4, s.y + 3, s.w - 8, 6, rt ? '#06140a' : '#123a1c');
    if (rt) {
      for (var gz = 0; gz < 3; gz++) r(s.x + 8 + gz * 12, s.y + 4, 6, 4, ((game.t / 6 | 0) + gz) % 3 ? '#4fdcff' : '#0a2a3a');
      var bl = Math.round(Math.sin(game.t * 0.14) * 2);
      r(s.x + s.w / 2 - 5, s.y - 18 - bl, 10, 6, '#ffe14d');
      r(s.x + s.w / 2 - 3, s.y - 12 - bl, 6, 4, '#ffe14d');
      r(s.x + s.w / 2 - 1, s.y - 8 - bl, 2, 3, '#ffe14d');
      if (!noCano) {
        var lw2 = tw('ENTRE NO CANO', 6) + 10;
        r(s.x + s.w / 2 - lw2 / 2, s.y - 32 - bl, lw2, 11, 'rgba(6,14,26,0.9)');
        txt('ENTRE NO CANO', s.x + s.w / 2, s.y - 31 - bl, 6, '#ffe14d', 'center', false);
      }
    } else if (s.saida) {
      // cano de saida: grelha aberta e vapor do pipeline
      for (var gs = 0; gs < 4; gs++) r(s.x + 6 + gs * 8, s.y + 3, 3, 6, '#1c6b28');
      if ((game.t % 90) < 30) {
        var vy = (game.t % 30);
        ctx.globalAlpha = Math.max(0, 0.5 - vy / 60);
        r(s.x + 12, s.y - 6 - vy * 0.5, 5, 4, '#bff0c8');
        r(s.x + 24, s.y - 10 - vy * 0.4, 4, 3, '#bff0c8');
        ctx.globalAlpha = 1;
      }
      if (!noCano) txt('SAIDA', s.x + s.w / 2, s.y - 11, 6, '#7ef29d', 'center');
    } else {
      // selado quando a rota nao e real-time
      for (var gg2 = 0; gg2 < 4; gg2++) r(s.x + 6 + gg2 * 8, s.y + 3, 3, 6, '#8fa3b5');
      if (!noCano) txt('0ms', s.x + s.w / 2, s.y - 10, 6, '#5d7896', 'center');
    }
  } else if (k === 'steel') {
    box3(s.x, s.y, s.w, s.h, '#69809a', '#a3bad2', '#33414f');
    for (var q = 0; q < s.w; q += 8) r(s.x + q + 2, s.y + 4, 3, 3, '#455568');
    r(s.x, s.y + s.h - 2, s.w, 2, '#ffc93c');
  } else if (k === 'neuron') {
    ctx.globalAlpha = 0.20;
    r(s.x - 5, s.y - 9, s.w + 10, s.h + 16, '#a48bff');
    ctx.globalAlpha = 1;
    // dendritos
    r(s.x - 5, s.y + 2, 5, 2, '#8f7ae0');
    r(s.x + s.w, s.y + 2, 5, 2, '#8f7ae0');
    r(s.x + 8, s.y - 6, 2, 6, '#8f7ae0');
    r(s.x + s.w - 10, s.y - 6, 2, 6, '#8f7ae0');
    box3(s.x, s.y, s.w, s.h, '#6a55c4', '#ab97f2', '#33245e');
    // circuito sinaptico no topo
    for (var nn = 0; nn < s.w - 10; nn += 12) {
      r(s.x + 5 + nn, s.y + 3, 8, 2, '#d9ccff');
      r(s.x + 9 + nn, s.y + 1, 2, 2, ((game.t / 9 | 0) + nn) % 3 ? '#ffe14d' : '#4fdcff');
    }
    r(s.x, s.y + s.h - 1, s.w, 1, '#241a44');
  } else if (k === 'pedestal') {
    box3(s.x, s.y, s.w, s.h, '#e6e3d8', '#f8f6ef', '#a8a294');
    r(s.x, s.y + 1, s.w, 1, '#ffe6a8');
    for (var pf = 0; pf < s.w - 6; pf += 8) r(s.x + 4 + pf, s.y + 4, 2, s.h - 6, '#c6c2b4');
    r(s.x + 3, s.y + s.h, s.w - 6, 3, '#8d8a7c');
  } else {
    box3(s.x, s.y, s.w, s.h, '#41556f', '#6a86ad', '#232f3e');
  }
}

function drawPress(pr) {
  r(pr.x + 11, pr.top - 44, 8, (pr.y - pr.top) + 44, '#2c3d52');
  r(pr.x + 12, pr.top - 44, 3, (pr.y - pr.top) + 44, '#4a6a8c');
  box3(pr.x, pr.y, pr.w, pr.h, '#2f7fd0', '#77bdf5', '#12365e');
  for (var i = 0; i < pr.w - 4; i += 6) r(pr.x + 2 + i, pr.y + pr.h - 7, 3, 5, '#ffc93c');
  r(pr.x + 2, pr.y + pr.h - 2, pr.w - 4, 2, '#0f2e50');

function drawBug(b) {
  if (b.dead) {
    if (b.dead > 22) return;
    ctx.globalAlpha = 1 - b.dead / 22;
    r(b.x, b.y + 6, b.w, 4, '#8b1e34');
    ctx.globalAlpha = 1;
    return;
  }
  var pul = Math.sin(b.t * 0.16) * 1;
  var legs = Math.floor(b.t / 6) % 2;
  r(b.x - 1, b.y + 6 + legs, 2, 4, '#6e1122');
  r(b.x + b.w - 1, b.y + 6 + (1 - legs), 2, 4, '#6e1122');
  box3(b.x + 1, b.y + 2 - pul, b.w - 2, b.h - 2, '#e0374f', '#ff7a8e', '#8b1e34');
  r(b.x + 3, b.y + 4 - pul, 2, 2, '#ffffff');
  r(b.x + 7, b.y + 4 - pul, 2, 2, '#ffffff');
  r(b.x + 3, b.y + 4 - pul, 1, 1, '#151515');
  r(b.x + 8, b.y + 4 - pul, 1, 1, '#151515');
  r(b.x + 2, b.y - pul, 1, 2, '#8b1e34');
  r(b.x + 9, b.y - pul, 1, 2, '#8b1e34');
  txt('!', b.x + b.w / 2, b.y - 9 - pul, 7, '#ffd0d8', 'center');
}

/* estrela coletavel em pixel art (mascara 13x11) */
var STAR = [
  '......X......',
  '.....XXX.....',
  '.....XXX.....',
  'XXXXXXXXXXXXX',
  '.XXXXXXXXXXX.',
  '..XXXXXXXXX..',
  '..XXXXXXXXX..',
  '..XXXXXXXXX..',
  '..XXX.X.XXX..',
  '.XX...X...XX.',
  '.X.........X.'
];
function starMask(x, y, colFn) {
  for (var ry = 0; ry < STAR.length; ry++) {
    var row = STAR[ry], start = -1, run = 0;
    for (var c = 0; c <= row.length; c++) {
      if (row.charAt(c) === 'X') { if (start < 0) start = c; run++; }
      else if (start >= 0) { r(x + start, y + ry, run, 1, colFn(ry)); start = -1; run = 0; }
    }
  }
}
function drawStarPix(x, y, col, hi, sh, outline) {
  if (outline) {
    var offs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (var i = 0; i < 4; i++) starMask(x + offs[i][0], y + offs[i][1], function () { return outline; });
  }
  starMask(x, y, function (ry) { return ry < 3 ? hi : (ry > 7 ? sh : col); });
  r(x + 4, y + 4, 2, 1, '#fffbe6');
  r(x + 4, y + 5, 1, 1, '#fffbe6');
}
function drawTag(t) {
  if (t.got) return;
  var fl = Math.sin(t.t * 0.09) * 2;
  var pul = 0.5 + 0.5 * Math.sin(t.t * 0.12);
  ctx.globalAlpha = 0.09 + 0.11 * pul;
  r(t.x - 4, t.y + 4 + fl, 22, 6, '#ffe14d');
  r(t.x + 4, t.y - 3 + fl, 6, 20, '#ffe14d');
  ctx.globalAlpha = 1;
  drawStarPix(t.x, t.y + 1 + fl, '#ffc933', '#ffe89a', '#d99a12', '#7a5408');
  // brilhos girando
  var sp = Math.sin(t.t * 0.18);
  if (sp > 0.6) { r(t.x + 14, t.y + fl, 2, 2, '#fffbe6'); r(t.x - 2, t.y + 8 + fl, 2, 2, '#fffbe6'); }

/* fogos de artificio pixelados: tres estouros em tempos diferentes */
function drawFogos(cx, cy, t) {
  var i, j, ex = [[0, -6, '#ffe14d'], [-26, 6, '#ff5f8f'], [24, -2, '#7ef29d'], [-12, -20, '#4fdcff']];
  for (i = 0; i < ex.length; i++) {
    var atraso = i * 16, tt = t - atraso;
    if (tt < 0 || tt > 46) continue;
    var rad = tt * 1.5, alpha = Math.max(0, 1 - tt / 46);
    ctx.globalAlpha = alpha;
    for (j = 0; j < 12; j++) {
      var a = (j / 12) * Math.PI * 2 + i;
      var px9 = cx + ex[i][0] + Math.cos(a) * rad;
      var py9 = cy + ex[i][1] + Math.sin(a) * rad * 0.8 + tt * tt * 0.012;
      r(px9, py9, 2, 2, ex[i][2]);
      if (tt > 14) r(px9 - Math.cos(a) * 4, py9 - Math.sin(a) * 3, 1, 1, '#ffffff');
    }
    // nucleo do estouro
    if (tt < 8) r(cx + ex[i][0] - 2, cy + ex[i][1] - 2, 4, 4, '#ffffff');
    ctx.globalAlpha = 1;
  }
}

function drawSprite(fr, px, py, flip) {
  for (var y = 0; y < fr.length; y++) {
    var row = fr[y], x = 0;
    while (x < SPR_W) {
      var ch = row.charAt(x);
      if (ch === '.') { x++; continue; }
      var n = 1;
      while (x + n < SPR_W && row.charAt(x + n) === ch) n++;
      r(px + (flip ? SPR_W - x - n : x), py + y, n, 1, SPR_PAL[ch]);
      x += n;
    }
  }
}
function drawPlayer() {
  if (P.inv > 0 && Math.floor(P.inv / 3) % 2 === 0) return;
  var px = Math.round(P.x + P.w / 2 - SPR_W / 2);
  var py = Math.round(P.y + P.h - SPR_H);
  // sombra no chao
  ctx.globalAlpha = 0.20;
  r(P.x + 1, P.y + P.h - 1, P.w - 2, 2, '#0b1420');
  ctx.globalAlpha = 1;
  // trilha neon da rota real-time
  if (game.route === 'realtime' && Math.abs(P.vx) > 1.6) {
    ctx.globalAlpha = 0.42;
    for (var i = 1; i <= 3; i++) {
      r(px + (P.face > 0 ? -i * 5 : SPR_W + i * 5 - 4), py + 10, 4, 11,
        i === 1 ? '#ffe14d' : (i === 2 ? '#ffb020' : '#ff5f8f'));
    }
    ctx.globalAlpha = 1;
  }
  // quadro: as perninhas seguem a velocidade real do movimento
  var fr;
  if (!P.onGround) fr = P.vy < 0 ? SPR.air : SPR.fall;
  else if (Math.abs(P.vx) > 0.3) fr = SPR.run[Math.floor(P.anim / 3.1) % 4];
  else fr = SPR.idle;
  // a mascara foi desenhada olhando para a esquerda: espelha quando anda para a direita
  drawSprite(fr, px, py, P.face > 0);
}

/* Animacao de recebimento do boost de inteligencia comportamental */
function ringPx(cx, cy, rad, col) {
  if (rad < 3) return;
  var n = Math.max(12, Math.round(rad * 1.1));
  for (var i = 0; i < n; i++) {
    var a = (i / n) * Math.PI * 2;
    r(cx + Math.cos(a) * rad - 1, cy + Math.sin(a) * rad * 0.72 - 1, 2, 2, col);
  }
}
function drawBoostFX() {
  if (!brain) return;
  var t = game.winT;
  var bx = brain.x + brain.w / 2, by = brain.y + 28;
  // aneis de energia saindo do cerebro
  for (var i = 0; i < 4; i++) {
    var rr = ((t * 2.4 + i * 28) % 112);
    ctx.globalAlpha = Math.max(0, 1 - rr / 112) * 0.75;
    ringPx(bx, by, rr, i % 2 ? '#7ef29d' : '#4fdcff');
  }
  ctx.globalAlpha = 1;
  // feixe do cerebro ate a engenheira
  if (t > 26) {
    var px = P.x + P.w / 2, py = P.y + 6;
    var steps = 26;
    for (var s2 = 0; s2 <= steps; s2++) {
      var k = s2 / steps;
      var lx = bx + (px - bx) * k;
      var ly = by + (py - by) * k - Math.sin(k * Math.PI) * 14;
      ctx.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(t * 0.35 + s2 * 0.5));
      var w2 = s2 % 3 === 0 ? 4 : 3;
      r(lx - w2 / 2, ly - w2 / 2, w2, w2, s2 % 2 ? '#ffe14d' : '#7ef29d');
    }
    ctx.globalAlpha = 1;
  }
  // aura pulsante na engenheira
  if (t > 38) {
    var au = 3 + Math.sin(t * 0.32) * 2;
    ctx.globalAlpha = 0.30;
    r(P.x - au, P.y - au, P.w + au * 2, P.h + au * 2, '#7ef29d');
    ctx.globalAlpha = 0.18;
    r(P.x - au * 2, P.y - au * 2, P.w + au * 4, P.h + au * 4, '#4fdcff');
    ctx.globalAlpha = 1;
    // faiscas orbitando
    for (var o = 0; o < 5; o++) {
      var ang = t * 0.11 + o * 1.256;
      r(P.x + P.w / 2 + Math.cos(ang) * 15 - 1, P.y + P.h / 2 + Math.sin(ang) * 11 - 1, 2, 2, o % 2 ? '#ffe14d' : '#4fdcff');
    }
  }
  // contador do multiplicador subindo ate 10x
  if (t > 52) {
    var m = Math.min(10, 1 + Math.floor((t - 52) / 8));
    var lift = Math.min(24, (t - 52) * 0.35);
    txt(m + 'x', P.x + P.w / 2, P.y - 24 - lift, m >= 10 ? 16 : 12, m >= 10 ? '#ffe14d' : '#7ef29d', 'center');
    if (m >= 10) txt('AI BOOST', P.x + P.w / 2, P.y - 8 - lift, 7, '#4fdcff', 'center');
  }
}

}

function drawWorld() {
  var i, x0 = cam.x - 220, x1 = cam.x + VIEWW + 220;
  drawBG();
  for (i = 0; i < decor.length; i++) { var d = decor[i]; if (d.x > x0 && d.x < x1) drawDecor(d); }
  if (maestro && game.route && game.zone < 3 && maestro.x < x1 && maestro.x + 4000 > x0) {
    var col = game.route === 'realtime' ? '#ffe14d' : '#7ef29d';
    ctx.globalAlpha = 0.5;
    for (var t2 = 0; t2 < VIEWW; t2 += 12) {
      var tx3 = Math.max(maestro.x, cam.x) + t2;
      if (tx3 > cam.x + VIEWW) break;
      r(tx3 + ((game.t * 3) % 12), GY - 3, 7, 2, col);
    }
    ctx.globalAlpha = 1;
  }
  for (i = 0; i < solids.length; i++) { var s = solids[i]; if (s.x + s.w > x0 && s.x < x1) drawSolid(s); }
  for (i = 0; i < movers.length; i++) { var m = movers[i]; if (m.x + m.w > x0 && m.x < x1) drawSolid(m); }
  for (i = 0; i < gates.length; i++) { var g = gates[i]; if (g.x > x0 && g.x < x1) drawGate(g); }
  for (i = 0; i < levers.length; i++) { var l = levers[i]; if (l.x > x0 && l.x < x1) drawLever(l); }
  for (i = 0; i < bins.length; i++) { var bn = bins[i]; if (bn.x > x0 && bn.x < x1) drawBin(bn); }
  for (i = 0; i < cps.length; i++) { var c = cps[i]; if (c.x > x0 && c.x < x1) drawCP(c); }
  for (i = 0; i < tags.length; i++) { var tgg = tags[i]; if (tgg.x > x0 && tgg.x < x1) drawTag(tgg); }
  for (i = 0; i < fields.length; i++) { var fd = fields[i]; if (!fd.held && fd.x > x0 && fd.x < x1) drawField(fd); }
  for (i = 0; i < bugs.length; i++) { var b = bugs[i]; if (b.x > x0 && b.x < x1) drawBug(b); }
  for (i = 0; i < presses.length; i++) { var pr = presses[i]; if (pr.x > x0 && pr.x < x1) drawPress(pr); }
  if (maestro && maestro.x > x0 && maestro.x < x1) drawMaestro(maestro);
  if (brain && brain.x > x0 - 140 && brain.x < x1) drawBrain(brain);
  for (i = 0; i < npcs.length; i++) { var n = npcs[i]; if (n.x > x0 && n.x < x1) drawNPC(n); }
  drawPlayer();
  if (PIPE) drawSolid(PIPE.cano);                       // o cano tapa a engenheira
  else if (pipeRef && pipeRef.sink > 0 && !pipeRef.used) drawSolid(pipeRef);
  if (state === 'winseq') drawBoostFX();
  if (carry) drawField(carry);
  if (P.x < 250) balloon(P.x + 6, P.y - (carry ? 42 : 34), ['PRECISO ANALISAR O', 'COMPORTAMENTO DO USUARIO!'], 7, '#dff3ff');
  drawParts();
}

/* =====================================================================
   12a. TUNEL REAL-TIME — a rota turbo do Data Maestro
   Corrida subterranea acelerada de um botao: desvie de blocos, buracos
   e obstrucoes de teto ate a saida na Customer Data Platform.
   ===================================================================== */
var TUN = null;
var TUN_STARS = ['evento_0ms', 'kafka_topic', 'stream_key', 'hot_path', 'p99_latencia',
                 'exactly_once', 'watermark', 'micro_batch'];
var TUN_OBS_LABEL = ['NULL', 'DUPLICADO', 'LAG', 'BACKPRESSURE'];

/* chao das fases de tela cheia: sempre acima dos botoes touch,
   em qualquer formato de celular */
function playFloorY() {
  var L = padLayout();
  var padTop = (L.left.y - VOY) / VS;
  return Math.round(Math.max(VIEWH * 0.52, Math.min(VIEWH - 52, padTop - 8)));
}
function tunFY() { return playFloorY(); }
function tunCY() { return 42; }

function tunnelStart() {
  TUN = {
    t: 0, dist: 0, goal: 3600, spd: 3.2, anim: 0,
    px: Math.max(18, Math.round(VIEWW * 0.26)), y: 0, vy: 0, onG: true, face: 1,
    hp: 3, inv: 0, obs: [], stars: [], nextObs: 300, starIdx: 0,
    ok: 0, okT: 0, shake: 0
  };
  TUN.y = tunFY() - P.h;
  state = 'tunnel';
  MUS.on = true;
  SFX.turbo();
  track('tunnel_start', {});
  toast('TUNEL REAL-TIME · ZERO LATENCY', '#ffe14d');
}
function tunnelFinish() {
  // fim da corrida: a porta da arena do FinOps se abre
  TUN = null;
  arenaStart('realtime');
}
function tunnelDeath() {
  if (state !== 'tunnel') return;
  SFX.error();
  game.deaths++;
  game.deadIn = 'tunnel';
  track('player_death', { onde: 'tunel', progresso: Math.round(TUN.dist / TUN.goal * 100), mortes: game.deaths });
  burst(TUN.px + 6, TUN.y + 8, 26, '#ff4d6d', 3);
  MUS.on = false;
  state = 'dead';
}
function tunnelHit() {
  var T = TUN;
  if (T.inv > 0) return;
  T.hp--; T.inv = 84; T.shake = 14; SFX.error();
  burst(T.px + 6, T.y + 8, 16, '#ff4d6d', 2.4);
  T.spd = Math.max(2.6, T.spd - 1.0);
  if (T.hp <= 0) {
    T.hp = 3; T.inv = 110; T.y = tunFY() - P.h; T.vy = 0;
    T.dist = 0; T.spd = 3.2;
    T.obs.length = 0; T.stars.length = 0; T.nextObs = 300; T.starIdx = 0;
    toast('BUFFER ESTOUROU · REINICIANDO O STREAM', '#ffb020');
  }
}
function tunnelUpdate() {
  var T = TUN, i, FY = tunFY(), CY = tunCY();
  T.t++;
  readInput();
  if (T.ok) { T.okT++; if (T.okT > 80) tunnelFinish(); return; }
  if (T.inv > 0) T.inv--;
  if (T.shake > 0) T.shake--;

  T.spd = Math.min(4.8, T.spd + 0.0026);
  T.dist += T.spd;
  T.anim += T.spd;

  if (jumpEdge && T.onG) { T.vy = JUMPV; T.onG = false; SFX.jump(); }
  if (!IN.jump && T.vy < -2.6) T.vy = -2.6;
  T.vy += GRAV;
  if (T.vy > MAXFALL) T.vy = MAXFALL;
  T.y += T.vy;

  var pesAntes = T.y + P.h - T.vy;
  var overPit = false;
  for (i = 0; i < T.obs.length; i++) {
    var o = T.obs[i];
    if (o.kind === 'pit' && T.px + P.w > o.x + 3 && T.px < o.x + o.w - 3) overPit = true;
  }
  // so volta ao chao quem vinha de cima dele: sem isso, em alta velocidade,
  // a personagem afundava no abismo e era recolhida pelo chao do outro lado
  if (!overPit && T.y + P.h >= FY && pesAntes <= FY + Math.max(3, T.vy)) {
    T.y = FY - P.h; T.vy = 0; T.onG = true;
  } else if (T.y + P.h >= FY) T.onG = false;
  if (T.y > FY + 26) { tunnelDeath(); return; }        // caiu no abismo = game over
  if (T.y < CY + 4) { T.y = CY + 4; T.vy = 0.8; }

  // geracao de obstaculos
  T.nextObs -= T.spd;
  if (T.nextObs <= 0 && T.dist < T.goal - 320) {
    var n = T.obs.length;
    var kinds = ['block', 'hang', 'pit', 'roller', 'hang', 'block', 'pit', 'drone',
                 'block', 'roller', 'pit', 'hang', 'drone', 'block'];
    var k = kinds[n % kinds.length];
    var ox = VIEWW + 24;
    if (k === 'block') T.obs.push({ kind: k, x: ox, y: FY - 26, w: 22, h: 26, label: TUN_OBS_LABEL[n % 4] });
    else if (k === 'hang') T.obs.push({ kind: k, x: ox, y: CY, w: 26, h: FY - CY - 36, label: 'SCHEMA DRIFT' });
    else if (k === 'roller') T.obs.push({ kind: k, x: ox, y: FY - 22, w: 22, h: 22, extra: 0.9, spin: 0, label: 'BURN RATE' });
    else if (k === 'drone') T.obs.push({ kind: k, x: ox, y: FY - 54, w: 30, h: 22, bob: 0, label: 'ALERTA DE CUSTO' });
    else {
      var pw3 = Math.round(Math.max(34, Math.min(78, T.spd * 15 - 12)));
      T.obs.push({ kind: k, x: ox, y: FY, w: pw3, h: 70, label: 'GAP' });
    }
    T.nextObs = 210 + (n % 3) * 40;
  }
  // 5 estrelas garantidas, na altura da cabeca (pegas correndo)
  if (T.starIdx < 8 && T.dist > T.goal * (0.10 + T.starIdx * 0.105)) {
    T.stars.push({ x: VIEWW + 70, y: FY - 30, label: TUN_STARS[T.starIdx], t: 0 });
    T.starIdx++;
  }
  for (i = T.obs.length - 1; i >= 0; i--) {
    var ob = T.obs[i];
    ob.x -= T.spd + (ob.extra || 0);
    if (ob.kind === 'roller') ob.spin += T.spd * 0.14;
    if (ob.kind === 'drone') ob.bob = Math.sin(T.t * 0.06 + ob.x * 0.02) * 3;
    if (ob.x + ob.w < -40) { T.obs.splice(i, 1); continue; }
    if (ob.kind === 'pit') continue;
    var oy = ob.y + (ob.kind === 'drone' ? ob.bob : 0);
    if (T.inv === 0 && T.px + P.w > ob.x + 2 && T.px < ob.x + ob.w - 2 &&
        T.y + P.h > oy + 2 && T.y < oy + ob.h - 2) tunnelHit();
  }
  for (i = T.stars.length - 1; i >= 0; i--) {
    var st = T.stars[i];
    st.x -= T.spd; st.t++;
    if (st.x < -24) { T.stars.splice(i, 1); continue; }
    if (T.px + P.w > st.x && T.px < st.x + 14 && T.y + P.h > st.y && T.y < st.y + 14) {
      if (!game.tunStars[st.label]) { game.tunStars[st.label] = 1; game.tagsGot++; }
      game.score += 100 * game.mult;
      SFX.collect(); burst(st.x + 7, st.y + 7, 12, '#ffe14d', 2);
      T.stars.splice(i, 1);
    }
  }
  if (T.dist >= T.goal && !T.ok) {
    // a corrida acaba na porta da arena: a luta contra o FinOps abre em seguida
    T.ok = 1; T.okT = 0; SFX.victory();
    track('tunnel_complete', { buffers: T.hp, estrelas: Object.keys(game.tunStars).length });
    game.score += 2500 + T.hp * 800;
  }
}

/* ---- ARTE DO DINHEIRO: cifra viva, fatura voadora e nota gigante ---- */
function drawBill(x, y, label) {                   // fatura disparada pelo boss
  box3(x, y, 16, 13, '#c8b45a', '#f4e69a', '#5f5220');

}
function drawBigNote(x, y, t) {                    // premio: nota de dinheiro gigante
  var fl = Math.sin(t * 0.12) * 2, w = 46, h = 30;

/* a propria cifra e o miniboss: R$ gigante com olhos e bracos */
function drawCifra(x, y, w, h, alpha, hp, max, t, camada) {
  var i, bob = Math.sin(t * 0.09) * 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  // aura de custo
  ctx.globalAlpha = alpha * 0.18;
  r(x - 6, y + bob - 5, w + 12, h + 10, hp > 1 ? '#ff5f8f' : '#ffe14d');
  ctx.globalAlpha = alpha;
  // corpo: cedula dobrada servindo de capa da cifra
  box3(x, y + bob, w, h, '#2f6d4b', '#63c78d', '#12301f');
  r(x + 3, y + bob + 3, w - 6, h - 6, '#255c3e');
  for (i = 0; i < h - 8; i += 6) r(x + 4, y + bob + 5 + i, w - 8, 2, 'rgba(126,242,157,0.10)');
  // a cifra em pixel art (R$ gigante)
  txt('R$', x + w / 2, y + bob + Math.round(h * 0.2), Math.max(13, Math.round(w * 0.47)), '#eafff2', 'center', false);
  // olhos sobre a cifra
  var blink = (t % 170) < 9, ew = Math.max(5, Math.round(w * 0.15));
  r(x + 6, y + bob + 6, ew, blink ? 1 : 6, '#0b1a12');
  r(x + w - 6 - ew, y + bob + 6, ew, blink ? 1 : 6, '#0b1a12');
  if (!blink) {
    r(x + 7, y + bob + 7, 3, 3, '#ff5f8f');
    r(x + w - 10, y + bob + 7, 3, 3, '#ff5f8f');
  }
  // bracos de moeda
  for (i = 0; i < 2; i++) {
    var ax = i ? x + w : x - 9, sw = Math.sin(t * 0.16 + i * 2) * 3;
    r(ax, y + bob + Math.round(h * 0.44) + sw, 9, 5, '#ffc93c');
    r(ax + (i ? 6 : 0), y + bob + Math.round(h * 0.44) + 4 + sw, 4, 4, '#f0913f');
  }
  ctx.restore();
  // camada de desperdicio ativa + vida
  var lab = camada || '';
  var w2 = tw(lab, 6) + 10;
  r(x + w / 2 - w2 / 2, y + bob - 26, w2, 11, 'rgba(6,14,26,0.9)');
  r(x + w / 2 - w2 / 2, y + bob - 26, w2, 1, '#ff5f8f');
  txt(lab, x + w / 2, y + bob - 24, 6, '#ffd0d8', 'center', false);
  for (i = 0; i < max; i++) r(x + w / 2 - (max * 11) / 2 + i * 11, y + bob - 13, 9, 4, i < hp ? '#ff5f8f' : '#31404f');
}

function tunnelDraw() {
  var T = TUN, i, FY = tunFY(), CY = tunCY();
  var sh = T.shake > 0 ? ((T.t % 2) ? 2 : -2) : 0;
  ctx.save();
  ctx.translate(sh, 0);

  var g = ctx.createLinearGradient(0, CY, 0, FY);
  g.addColorStop(0, '#0d1c2b'); g.addColorStop(0.5, '#133449'); g.addColorStop(1, '#0a1622');
  ctx.fillStyle = g; ctx.fillRect(-6, CY, VIEWW + 12, FY - CY);

  // aneis estruturais do tunel
  for (i = -1; i < Math.ceil(VIEWW / 88) + 2; i++) {
    var rx = i * 88 - ((T.anim * 0.55) % 88);
    r(rx, CY, 9, FY - CY, 'rgba(70,125,170,0.14)');
    r(rx, CY, 9, 5, '#2b5b7c');
    r(rx, FY - 5, 9, 5, '#2b5b7c');
  }
  // linhas de velocidade
  for (i = 0; i < 18; i++) {
    var ly = CY + 10 + ((i * 41) % Math.max(10, FY - CY - 16));
    var lx = VIEWW - (((T.anim * (1 + (i % 3) * 0.5)) + i * 97) % (VIEWW + 200)) + 40;
    ctx.globalAlpha = 0.16 + (i % 3) * 0.09;
    r(lx, ly, 34 + (i % 4) * 22, 2, i % 2 ? '#4fdcff' : '#ffe14d');
  }
  ctx.globalAlpha = 1;
  // cabos no teto
  for (i = -1; i < Math.ceil(VIEWW / 60) + 2; i++) {
    var cxp = i * 60 - ((T.anim * 0.8) % 60);
    r(cxp, CY + 6, 30, 2, '#2a4a66');
    r(cxp + 10, CY + 8, 3, 4, '#39d3ff');
  }
  // teto e chao
  r(-6, CY - 44, VIEWW + 12, 48, '#101a26');
  r(-6, CY, VIEWW + 12, 4, '#3d6b8c');
  for (i = 0; i < VIEWW + 12; i += 12) r(i - 6, CY + 4, 6, 3, '#ffc93c');
  r(-6, FY, VIEWW + 12, 6, '#3d6b8c');
  r(-6, FY + 6, VIEWW + 12, VIEWH, '#0a121c');
  for (i = 0; i < VIEWW + 12; i += 16) r(i - 6 - ((T.anim * 1) % 16), FY + 8, 8, 2, 'rgba(120,190,240,0.20)');

  // obstaculos
  for (i = 0; i < T.obs.length; i++) {
    var o = T.obs[i];
    if (o.kind === 'block') {
      box3(o.x, o.y, o.w, o.h, '#a8324a', '#e0637a', '#5c1425');
      r(o.x + 4, o.y + 5, o.w - 8, 4, '#ffd0d8');
      txt(o.label, o.x + o.w / 2, o.y - 11, 6, '#ff9db0', 'center');
    } else if (o.kind === 'hang') {
      box3(o.x, o.y, o.w, o.h, '#7a4f0a', '#ffb020', '#3d2705');
      for (var hh = 0; hh < o.h - 6; hh += 8) r(o.x + 4, o.y + 6 + hh, o.w - 8, 3, '#3d2705');
      r(o.x - 3, o.y + o.h, o.w + 6, 6, '#ffb020');
      r(o.x - 3, o.y + o.h + 6, o.w + 6, 3, '#7a4f0a');
      txt(o.label, o.x + o.w / 2, o.y + o.h + 14, 6, '#ffd79a', 'center');
    } else if (o.kind === 'roller') {
      // roda de custo rolando contra a engenheira (BURN RATE)
      var rcx = o.x + o.w / 2, rcy = o.y + o.h / 2;
      box3(o.x, o.y, o.w, o.h, '#8a3a20', '#e0743f', '#3c1508');
      r(o.x + 3, o.y + 3, o.w - 6, o.h - 6, '#f0913f');
      for (var sp = 0; sp < 4; sp++) {
        var an = o.spin + sp * 1.5708;
        r(rcx + Math.cos(an) * 6 - 1.5, rcy + Math.sin(an) * 6 - 1.5, 3, 3, '#5c2410');
      }
      r(rcx - 2, rcy - 2, 4, 4, '#ffe14d');
      txt(o.label, rcx, o.y - 11, 6, '#ffb99a', 'center');
    } else if (o.kind === 'drone') {
      // alerta de custo pairando: passe por baixo correndo, nao pule
      var dy2 = o.y + o.bob;
      r(o.x + 4, dy2 - 4, o.w - 8, 4, '#2a4a66');
      box3(o.x, dy2, o.w, o.h, '#5a2a44', '#b04a72', '#28101e');
      r(o.x + 4, dy2 + 4, o.w - 8, 8, '#1a0a12');
      txt('R$!', o.x + o.w / 2, dy2 + 5, 7, (T.t % 30) < 15 ? '#ff5f8f' : '#ffe14d', 'center', false);
      for (var pv = 0; pv < 2; pv++) r(o.x + 3 + pv * (o.w - 9), dy2 + o.h, 6, 3, '#ff5f8f');
      txt(o.label, o.x + o.w / 2, dy2 - 13, 6, '#ff9db0', 'center');
    } else {
      r(o.x, FY, o.w, 6, '#0a121c');
      r(o.x, FY + 6, o.w, VIEWH, '#06090f');
      r(o.x - 3, FY - 2, 4, 8, '#2b5b7c');
      r(o.x + o.w - 1, FY - 2, 4, 8, '#2b5b7c');
      txt('ABISMO', o.x + o.w / 2, FY + 12, 6, '#4a6c8c', 'center');
    }
  }
  // estrelas do stream
  for (i = 0; i < T.stars.length; i++) {
    var st = T.stars[i], fl = Math.sin(st.t * 0.2) * 2;
    ctx.globalAlpha = 0.12;
    r(st.x - 4, st.y + 4 + fl, 22, 6, '#ffe14d');
    r(st.x + 4, st.y - 3 + fl, 6, 20, '#ffe14d');
    ctx.globalAlpha = 1;
    drawStarPix(st.x, st.y + 1 + fl, '#ffc933', '#ffe89a', '#d99a12', '#7a5408');
    txt(st.label, st.x + 7, st.y - 12 + fl, 6, '#fff0a8', 'center');
  }
  // engenheira correndo (rastro turbo)
  if (!(T.inv > 0 && Math.floor(T.inv / 4) % 2 === 0)) {
    ctx.globalAlpha = 0.4;
    for (i = 1; i <= 4; i++) r(T.px - i * 6, T.y + 4, 5, 11, i < 2 ? '#ffe14d' : (i < 4 ? '#ffb020' : '#ff5f8f'));
    ctx.globalAlpha = 1;
    var sv = [P.x, P.y, P.vx, P.onGround, P.face, P.anim, P.inv];
    P.x = T.px; P.y = T.y; P.vx = 2.8; P.onGround = T.onG; P.face = 1; P.anim = T.anim; P.inv = 0;
    drawPlayer();
    P.x = sv[0]; P.y = sv[1]; P.vx = sv[2]; P.onGround = sv[3]; P.face = sv[4]; P.anim = sv[5]; P.inv = sv[6];
  }
  ctx.restore();

  // ---- HUD do tunel
  r(0, 0, VIEWW, 30, 'rgba(8,16,28,0.86)');
  r(0, 30, VIEWW, 1, 'rgba(79,220,255,0.55)');
  txt('TUNEL REAL-TIME', 6, 4, VIEWW < 380 ? 9 : 11, '#ffe14d');
  txt('ZERO LATENCY · desvie e nao pare', 6, 18, VIEWW < 380 ? 6 : 7, '#a8bdd6');
  var pct = Math.min(100, Math.round(T.dist / T.goal * 100));
  txt(pct + '%', VIEWW - 6, 4, VIEWW < 380 ? 9 : 11, '#7ef29d', 'right');
  for (i = 0; i < 3; i++) {
    var on = i < T.hp;
    r(VIEWW - 8 - (i + 1) * 12, 19, 9, 8, on ? '#4fdcff' : '#20323f');
    r(VIEWW - 8 - (i + 1) * 12 + 1, 20, 3, 2, on ? '#bff0ff' : '#20323f');
  }
  var bw = Math.min(240, VIEWW - 60), bx = VIEWW / 2 - bw / 2;
  r(bx - 2, 34, bw + 4, 12, '#0a1421');
  r(bx, 36, bw, 8, '#16283c');
  r(bx, 36, bw * (pct / 100), 8, '#ffe14d');

  if (T.t > 2400 && !T.ok && state === 'tunnel') {

    r(sx2, 50, sw, 13, 'rgba(10,20,34,0.9)');
    r(sx2, 50, sw, 1, '#ffb020');
    txt('PULAR FASE', VIEWW / 2, 52, 7, '#ffb020', 'center', false);
    regBtn('tun-skip', sx2, 50, sw, 13);
  }
